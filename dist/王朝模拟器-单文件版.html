          el('header', {}, severityTag(e.severity), el('strong', {}, ` ${e.title}`)),
          el('div', { class: 'muted small' }, `${e.date} · ${e.category}${region ? ' · ' + region.name : ''}${person ? ' · ' + person.name : ''}`),
          el('p', { class: 'event-desc' }, e.description)));
      }
    },
  };

  /* ============================================================
   * 外交视图
   * ============================================================ */
  const diploView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      host.append(sectionTitle(t().view_diplo, el('span', { class: 'muted small' }, '可对任何势力以自然语言下诏（互市、和亲、岁币、宣战……）。')));
      for (const d of state.diplomacy) {
        const relCls = d.relation <= -30 ? 'bad' : d.relation >= 30 ? 'good' : '';
        host.append(el('article', { class: 'diplo-card panel' },
          el('header', {}, el('strong', {}, d.name), el('span', { class: 'tag' }, d.type),
            d.borderPressure >= 60 ? el('span', { class: 'tag sev-high' }, '边警') : null),
          el('p', { class: 'muted small' }, d.desc),
          el('div', { class: 'kv-grid' },
            kv('关系', bar((d.relation + 100) / 2, relCls, '关系')),
            kv('信任', bar(d.trust, '', '信任')),
            kv('贸易', bar(d.trade, '', '贸易')),
            kv('威胁', bar(d.threat, 'bad', '威胁')),
            kv('边压', bar(d.borderPressure, d.borderPressure >= 60 ? 'bad' : '', '边境压力')))));
      }
    },
  };

  /* ============================================================
   * 国史实录视图
   * ============================================================ */
  const histState = { q: '', year: 'all', type: 'all', page: 0, pageSize: 40 };
  const historyView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      histState.q = histState.q || '';

      const search = el('input', { type: 'search', placeholder: '搜索标题/描述关键词…', value: histState.q, 'aria-label': '搜索实录' });
      search.addEventListener('input', DS.util.debounce(() => {
        histState.q = search.value.trim();
        histState.page = 0;
        historyView.render(host);
      }, 250));

      const years = [...new Set(state.history.map((h) => h.date.split(' 年')[0]))].sort().reverse();
      const yearSel = el('select', { 'aria-label': '按年份筛选' },
        el('option', { value: 'all' }, '全部年份'),
        ...years.map((y) => el('option', { value: y, selected: histState.year === y ? '' : null }, y + ' 年')));
      yearSel.addEventListener('change', () => { histState.year = yearSel.value; histState.page = 0; historyView.render(host); });

      const types = [['all', '全部类型'], ['system', '系统'], ['order', '政令'], ['event', '事件'], ['relation', '人物关系'], ['policy', '国策']];
      const typeSel = el('select', { 'aria-label': '按类型筛选' },
        ...types.map(([v, lbl]) => el('option', { value: v, selected: histState.type === v ? '' : null }, lbl)));
      typeSel.addEventListener('change', () => { histState.type = typeSel.value; histState.page = 0; historyView.render(host); });

      let list = state.history;
      if (histState.year !== 'all') list = list.filter((h) => h.date.startsWith(histState.year + ' 年'));
      if (histState.type !== 'all') list = list.filter((h) => h.type === histState.type);
      if (histState.q) list = list.filter((h) => (h.title + h.description).includes(histState.q));

      const pages = Math.max(1, Math.ceil(list.length / histState.pageSize));
      histState.page = DS.util.clamp(histState.page, 0, pages - 1);
      const pageItems = list.slice(histState.page * histState.pageSize, (histState.page + 1) * histState.pageSize);

      host.append(sectionTitle(`《国史实录》`, el('span', { class: 'muted small' }, `共 ${list.length} 条`)),
        el('div', { class: 'hist-filters' }, search, yearSel, typeSel));

      if (!pageItems.length) host.append(emptyHint('没有符合条件的记录。'));
      const ul = el('ul', { class: 'hist-list' });
      for (const h of pageItems) {
        ul.append(el('li', { class: `hist-item type-${h.type}` },
          el('div', { class: 'hist-date' }, h.date),
          el('div', {},
            el('div', {}, el('strong', {}, h.title), el('span', { class: 'tag' }, typeName(h.type))),
            h.description ? el('p', { class: 'muted small' }, h.description) : null)));
      }
      host.append(ul);

      const pager = el('div', { class: 'pager' },
        el('button', { class: 'btn btn-sm', disabled: histState.page === 0 ? true : null, onclick: () => { histState.page--; historyView.render(host); } }, '‹ 上一页'),
        el('span', { class: 'muted small' }, `第 ${histState.page + 1} / ${pages} 页`),
        el('button', { class: 'btn btn-sm', disabled: histState.page >= pages - 1 ? true : null, onclick: () => { histState.page++; historyView.render(host); } }, '下一页 ›'));
      host.append(pager);
    },
  };
  function typeName(tp) {
    return ({ system: '系统', order: '政令', event: '事件', relation: '关系', policy: '国策' })[tp] || tp;
  }

  /* ============================================================
   * 存档视图
   * ============================================================ */
  const savesView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      host.append(sectionTitle(t().view_saves, el('span', { class: 'muted small' }, '自动保存于每次结束回合后写入 auto 槽。')));

      for (const meta of DS.Storage.listSaves()) {
        const row = el('div', { class: 'save-row' },
          el('div', { class: 'save-slot' }, meta.slot === 'auto' ? '自动' : meta.slot.toUpperCase()),
          meta.empty
            ? el('div', { class: 'muted' }, '—— 空 ——')
            : el('div', { class: 'save-meta' },
              el('div', {}, `${meta.meta.dynasty || ''} ${meta.meta.ruler || ''} · ${meta.meta.date || ''} · 第 ${meta.meta.turn || '?'} 回合`),
              el('div', { class: 'muted small' }, new Date(meta.timestamp).toLocaleString('zh-CN') + (meta.checksumMismatch ? ' ⚠ 校验和不匹配' : '') + (meta.label ? ' · ' + meta.label : ''))),
          el('div', { class: 'save-actions' },
            !meta.empty ? el('button', {
              class: 'btn btn-sm', disabled: !state,
              onclick: () => DS.UI.confirmDialog(`读取存档「${meta.slot}」？当前未保存的进度将丢失。`, () => DS.Game.loadSlot(meta.slot)),
            }, t().btn_load) : null,
            el('button', {
              class: 'btn btn-sm btn-primary', disabled: !state,
              onclick: () => DS.Game.saveToSlot(meta.slot),
            }, t().btn_save),
            !meta.empty ? el('button', { class: 'btn btn-sm', onclick: () => { try { DS.Storage.exportSave(meta.slot); } catch (e) { DS.UI.toast(e.message, 'error'); } } }, t().btn_export) : null,
            !meta.empty ? el('button', {
              class: 'btn btn-sm btn-danger',
              onclick: () => DS.UI.confirmDialog(`删除存档「${meta.slot}」？该操作不可撤销。`, () => { DS.Storage.deleteSave(meta.slot); savesView.render(host); DS.UI.toast('已删除'); }, true),
            }, t().btn_delete) : null));
        host.append(row);
      }

      // 导入
      const fileInput = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
      fileInput.addEventListener('change', async () => {
        const f = fileInput.files[0];
        fileInput.value = '';
        if (!f) return;
        try {
          const text = await DS.util.readFileText(f);
          const res = DS.Storage.importSave(text);
          DS.UI.toast(`导入成功，已写入 ${res.slot}` + (res.checksumMismatch ? '（⚠ 校验和不匹配）' : ''), 'success');
          savesView.render(host);
        } catch (e) { DS.UI.toast('导入失败：' + e.message, 'error', 6000); }
      });
      host.append(el('div', { class: 'row-gap', style: 'margin-top:1rem' },
        el('button', { class: 'btn', onclick: () => fileInput.click() }, '📂 导入存档文件'),
        fileInput));
    },
  };

  /* ============================================================
   * 设置视图
   * ============================================================ */
  let setTab = 'ai';
  let editingProfileId = null;

  const settingsView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const tabs = [
        ['ai', t().set_tab_ai], ['sim', t().set_tab_sim], ['game', t().set_tab_game],
        ['prompt', t().set_tab_prompt], ['data', t().set_tab_data], ['debug', t().set_tab_debug],
      ];
      host.append(sectionTitle(t().view_settings),
        el('div', { class: 'tabs', role: 'tablist' },
          ...tabs.map(([id, label]) => el('button', {
            class: 'tab' + (setTab === id ? ' active' : ''), role: 'tab',
            'aria-selected': setTab === id,
            onclick: () => { setTab = id; settingsView.render(host); },
          }, label))),
        el('div', { class: 'settings-body' }));
      const body = qs('.settings-body', host);
      ({ ai: renderAiTab, sim: renderSimTab, game: renderGameTab, prompt: renderPromptTab, data: renderDataTab, debug: renderDebugTab }[setTab])(body);
    },
  };

  /* ---------------- AI 标签页 ---------------- */
  function renderAiTab(body) {
    const st = DS.Storage.loadSettings();

    // Profile 列表
    const listBox = el('div', { class: 'profile-list' });
    for (const p of st.api.profiles) {
      listBox.append(el('div', { class: 'profile-row' + (editingProfileId === p.id ? ' editing' : '') },
        el('div', {},
          el('strong', {}, p.name),
          el('span', { class: 'tag' }, kindLabel(p.kind)),
          p.kind !== 'mock' ? el('div', { class: 'muted small' }, `${p.baseUrl || ''} · ${p.model || ''}`) : null),
        el('div', { class: 'row-gap' },
          el('button', { class: 'btn btn-sm', onclick: () => { editingProfileId = p.id; settingsView.render(body.parentNode); } }, '编辑'),
          p.kind !== 'mock' ? el('button', {
            class: 'btn btn-sm', onclick: async (ev) => {
              const btn = ev.target; btn.disabled = true; btn.textContent = '测试中…';
              try {
                const r = await DS.aiService.testProfile(p.id);
                DS.UI.modal({
                  title: '连接成功 ✓',
                  build(b) {
                    b.append(kv('模型', r.model), kv('响应时间', `${r.latencyMs} ms`), kv('回复', r.reply));
                  },
                  actions: [{ label: t().btn_close, primary: true }],
                });
              } catch (e) { showApiError(e); }
              btn.disabled = false; btn.textContent = t().btn_test;
            },
          }, t().btn_test) : null,
          p.kind !== 'mock' ? el('button', {
            class: 'btn btn-sm',
            onclick: () => {
              const copy = JSON.parse(JSON.stringify(p));
              copy.id = 'prof_' + DS.util.uid('').slice(2);
              copy.name += ' 副本';
              copy.apiKey = '';
              st.api.profiles.push(copy);
              persistAndRerender(st, body);
            },
          }, '复制') : null,
          p.kind !== 'mock' ? el('button', { class: 'btn btn-sm', onclick: () => exportProfile(p) }, '导出') : null,
          p.kind !== 'mock' ? el('button', {
            class: 'btn btn-sm btn-danger',
            onclick: () => DS.UI.confirmDialog(`删除配置「${p.name}」？`, () => {
              st.api.profiles = st.api.profiles.filter((x) => x.id !== p.id);
              for (const k of Object.keys(st.api.purposes)) if (st.api.purposes[k] === p.id) st.api.purposes[k] = 'mock_local';
              if (editingProfileId === p.id) editingProfileId = null;
              persistAndRerender(st, body);
            }, true),
          }, t().btn_delete) : null)));
    }

    body.append(
      el('div', { class: 'callout callout-warn' },
        '安全提示：纯前端页面直连 API 时，API Key 会暴露在浏览器网络请求中。敏感 Key 请使用「代理 URL」模式（Browser → 你的代理 → AI API）。本作不会、也绝不声称浏览器端保存的 Key 是安全的。',
      ),
      sectionTitle('API 配置（Profiles）', el('div', { class: 'row-gap' },
        el('button', { class: 'btn btn-sm btn-primary', onclick: () => { editingProfileId = 'NEW'; settingsView.render(body.parentNode); } }, '＋ 新建配置'),
        el('button', { class: 'btn btn-sm', onclick: () => profileFileInput(body) }, '导入配置'),
      )),
      listBox);

    // 编辑表单
    const editing = editingProfileId === 'NEW'
      ? blankProfile()
      : st.api.profiles.find((p) => p.id === editingProfileId);
    if (editing) renderProfileForm(body, st, editing);

    // 用途映射（多模型）
    body.append(sectionTitle('模型用途分配（可为不同任务使用不同模型）'));
    const purposeBox = el('div', {});
    for (const [key, label] of [['simulation', '政令推演'], ['dialogue', 'NPC 对话'], ['summary', '史官评语']]) {
      const sel = el('select', { 'aria-label': label });
      for (const p of st.api.profiles) sel.append(el('option', { value: p.id, selected: st.api.purposes[key] === p.id ? '' : null }, p.name));
      sel.addEventListener('change', () => { st.api.purposes[key] = sel.value; DS.Storage.saveSettings(st); DS.UI.renderTopbar(); });
      purposeBox.append(kv(label, sel));
    }
    body.append(purposeBox);

    // Token 控制
    body.append(sectionTitle('Token 与请求控制'));
    const num = (key, label, min, max, stepv, hintv) => {
      const inp = el('input', { type: 'number', min, max, step: stepv, value: st.ai[key], 'aria-label': label });
      inp.addEventListener('change', () => {
        st.ai[key] = DS.util.clamp(Number(inp.value) || min, min, max);
        DS.Storage.saveSettings(st);
      });
      const wrap = kv(label + (hintv ? `（${hintv}）` : ''), inp);
      return wrap;
    };
    body.append(num('timeoutMs', '超时（毫秒）', 5000, 300000, 1000),
      num('maxRetries', 'JSON 失败自动重试次数', 0, 3, 1),
      quickModeSelect(st));
    body.append(el('p', { class: 'muted small' }, '注：temperature/top_p 等参数是否生效取决于具体 API 的支持情况；快速/标准/高质量仅改变默认 max_tokens 建议，不保证所有服务都遵守。'));

    // CORS 说明
    body.append(el('div', { class: 'callout' },
      'CORS 提示：部分 API 不允许浏览器跨域请求。如果控制台出现 CORS 错误，请改用支持 CORS 的 API 服务，或自行部署后端代理并填写「代理 URL」。'));
  }

  function quickModeSelect(st) {
    const modes = [['fast', '快速（max_tokens≈800）'], ['standard', '标准（≈2000）'], ['quality', '高质量（≈4000）']];
    const sel = el('select', { 'aria-label': '推理质量' },
      ...modes.map(([v, l]) => el('option', { value: v, selected: st.ai.quickMode === v ? '' : null }, l)));
    sel.addEventListener('change', () => {
      st.ai.quickMode = sel.value;
      const suggest = { fast: 1500, standard: 4000, quality: 8000 }[sel.value];
      for (const p of st.api.profiles) if (p.kind !== 'mock') p.maxTokens = suggest;
      DS.Storage.saveSettings(st);
      DS.UI.toast(`已应用「${sel.value}」预设到所有配置（max_tokens=${suggest}）。推理模型请选「质量优先」。`);
    });
    return kv('推理质量预设', sel);
  }

  function kindLabel(kind) {
    return { mock: '本地 Demo', custom: '自定义请求' }[kind] || 'OpenAI Compatible';
  }
  function blankProfile() {
    return {
      id: 'NEW', name: '我的 API', kind: 'openai-compatible',
      baseUrl: 'https://api.example.com/v1', path: '/chat/completions',
      apiKey: '', model: '', temperature: 0.7, maxTokens: 4000, topP: '', timeoutMs: 60000,
      proxyUrl: '', method: 'POST', responsePath: 'choices.0.message.content',
      headers: {}, bodyTemplate: '',
    };
  }

  function renderProfileForm(body, st, prof) {
    const isNew = prof.id === 'NEW';
    const F = {};
    const field = (key, label, opts = {}) => {
      const inp = opts.rows
        ? el('textarea', { rows: opts.rows, value: prof[key] != null ? String(prof[key]) : '', placeholder: opts.ph || '', 'aria-label': label })
        : el('input', { type: opts.type || 'text', value: prof[key] != null ? String(prof[key]) : '', placeholder: opts.ph || '', 'aria-label': label, step: opts.step });
      F[key] = inp;
      return kv(label, inp);
    };

    const kindSel = el('select', { 'aria-label': '接口类型' },
      el('option', { value: 'openai-compatible', selected: prof.kind === 'openai-compatible' ? '' : null }, 'OpenAI Compatible（默认）'),
      el('option', { value: 'custom', selected: prof.kind === 'custom' ? '' : null }, 'Custom（完全自定义请求）'));
    F.kind = kindSel;

    // API Key 输入 + 显示/隐藏
    const keyInput = el('input', { type: 'password', value: prof.apiKey || '', placeholder: 'sk-••••••••••••••', 'aria-label': 'API Key', autocomplete: 'off' });
    F.apiKey = keyInput;
    const eyeBtn = el('button', {
      class: 'btn btn-sm', type: 'button', 'aria-label': '显示/隐藏 API Key',
      onclick: () => { keyInput.type = keyInput.type === 'password' ? 'text' : 'password'; },
    }, '👁');

    const form = el('div', { class: 'panel profile-form' },
      el('h4', {}, isNew ? '新建 API 配置' : `编辑：${prof.name}`),
      field('name', '名称'),
      kv('接口类型', kindSel),
      field('baseUrl', 'Base URL', { ph: 'https://api.example.com/v1' }),
      field('path', '请求路径', { ph: '/chat/completions' }),
      kv('请求方式（Custom 模式）', (() => {
        const sel = el('select', { 'aria-label': '请求方式' },
          ...['POST', 'PUT', 'GET'].map((m) => el('option', { value: m, selected: (prof.method || 'POST') === m ? '' : null }, m)));
        F.methodSel = sel;
        return sel;
      })()),
      field('model', '模型名称', { ph: 'example-model' }),
      kv('API Key（仅保存在本机浏览器）', el('span', { class: 'key-row' }, keyInput, eyeBtn)),
      field('proxyUrl', '代理 URL（可选，填写后请求走代理而非直连）', { ph: 'https://my-proxy.example.com/v1' }),
      field('temperature', 'Temperature', { type: 'number', step: '0.05' }),
      field('maxTokens', 'Max Tokens（推理模型建议 ≥8000）', { type: 'number' }),
      field('topP', 'top_p（可选）', { type: 'number', step: '0.05' }),
      field('timeoutMs', '超时（毫秒）', { type: 'number' }),
      field('responsePath', 'Response JSON Path', { ph: 'choices.0.message.content' }),
      field('headersText', '额外 Headers（每行 Key: Value）', { rows: 2, ph: 'X-Title: DynastySim' }),
      el('p', { class: 'muted small' }, 'Custom 模式可用：请求方式 POST/PUT、Body 模板占位符 {{model}} {{messages_json}} {{system}} {{user}} {{temperature}} {{max_tokens}}'),
      field('bodyTemplate', 'Body 模板（仅 Custom 模式；留空用默认结构）', { rows: 4, ph: '{"model":"{{model}}","messages":{{messages_json}},"temperature":{{temperature}}}' }),
      el('div', { class: 'row-gap' },
        el('button', {
          class: 'btn btn-primary', onclick: () => {
            // 收集表单
            prof.kind = F.kind.value;
            if (F.methodSel) prof.method = F.methodSel.value;
            for (const k of ['name', 'baseUrl', 'path', 'model', 'proxyUrl', 'responsePath']) {
              if (F[k]) prof[k] = F[k].value.trim();
            }
            prof.apiKey = F.apiKey.value.trim();
            for (const k of ['temperature', 'maxTokens', 'topP', 'timeoutMs']) {
              if (F[k]) prof[k] = F[k].value === '' ? (k === 'topP' ? '' : undefined) : Number(F[k].value);
            }
            // headers 解析
            prof.headers = {};
            const lines = (F.headersText ? F.headersText.value : '').split('\n');
            for (const line of lines) {
              const i = line.indexOf(':');
              if (i > 0) prof.headers[line.slice(0, i).trim()] = line.slice(i + 1).trim();
            }
            prof.bodyTemplate = F.bodyTemplate ? F.bodyTemplate.value : '';
            if (isNew) {
              prof.id = 'prof_' + DS.util.uid('').slice(2);
              st.api.profiles.push(prof);
              if (!st.api.profiles.some((x) => x.id === st.api.purposes.simulation && x.kind !== 'mock')) {
                // 不强制切换，保持用户选择
              }
            }
            DS.Storage.saveSettings(st);
            editingProfileId = null;
            DS.UI.toast('配置已保存');
            DS.UI.renderTopbar();
            settingsView.render(body.closest('.view') || document.body);
          },
        }, '保存配置'),
        el('button', { class: 'btn', onclick: () => { editingProfileId = null; settingsView.render(body.closest('.view') || document.body); } }, t().btn_cancel)),
    );
    body.append(form);
  }

  function exportProfile(p) {
    const clone = { ...p };
    delete clone.apiKey; // 导出默认剥离密钥
    DS.util.download(`dynasty-api-profile-${DS.util.todayStamp()}.json`, JSON.stringify(clone, null, 2));
    DS.UI.toast('已导出配置（不含 API Key）');
  }
  function profileFileInput(body) {
    const inp = el('input', { type: 'file', accept: '.json', style: 'display:none' });
    inp.addEventListener('change', async () => {
      const f = inp.files[0];
      inp.remove();
      if (!f) return;
      try {
        const obj = JSON.parse(await DS.util.readFileText(f));
        if (!obj || !obj.name) throw new Error('缺少 name 字段');
        const st = DS.Storage.loadSettings();
        st.api.profiles.push({
          ...blankProfile(), ...obj,
          id: 'prof_' + DS.util.uid('').slice(2),
          apiKey: '', // 导入的配置一律不带 Key，需手动填
        });
        DS.Storage.saveSettings(st);
        DS.UI.toast('配置已导入（出于安全考虑未导入 API Key）');
        settingsView.render(body.closest('.view') || document.body);
      } catch (e) { DS.UI.toast('导入失败：' + e.message, 'error'); }
    });
    document.body.append(inp);
    inp.click();
  }

  function persistAndRerender(st, body) {
    DS.Storage.saveSettings(st);
    DS.UI.renderTopbar();
    settingsView.render(body.closest('.view') || document.body);
  }

  /** 统一展示 API 错误（含状态码/原因建议/响应正文掩蔽） */
  function showApiError(err) {
    const e = err instanceof DS.AI.AIError ? err : new DS.AI.AIError(String(err && err.message || err));
    DS.UI.modal({
      title: 'API 请求失败',
      build(body) {
        body.append(
          el('p', {}, el('strong', {}, e.message)),
          e.httpStatus ? kv('HTTP 状态码', String(e.httpStatus)) : null,
          e.suggestion ? el('div', { class: 'callout' }, `可能原因与建议：${e.suggestion}`) : null,
          e.bodySnippet ? kv('响应正文（已掩蔽密钥）', el('pre', { class: 'snippet' }, e.bodySnippet)) : null,
        );
      },
      actions: [{ label: t().btn_close, primary: true }],
    });
  }

  /* ---------------- 推演标签页 ---------------- */
  function renderSimTab(body) {
    const st = DS.Storage.loadSettings();
    const defs = [
      ['inertia', '历史惯性', '越高则变革阻力越大、世界越难被一句话扭转'],
      ['randomness', '随机性', '影响事件时机与细节的波动'],
      ['npcIndependence', 'NPC 独立性', '越高则大臣越多依据自身利益行动'],
      ['eventDensity', '事件密度', '每回合随机事件的期望数量'],
      ['longTermImpact', '长期后果强度', '影响延迟后果的力度'],
    ];
    body.append(sectionTitle('推演参数（实时生效）'));
    for (const [key, label, hintv] of defs) {
      const rangeEl = el('input', { type: 'range', min: '0', max: '1', step: '0.05', value: String(st.simulation[key]), 'aria-label': label });
      const valSpan = el('span', { class: 'range-val' }, Math.round(st.simulation[key] * 100) + '%');
      rangeEl.addEventListener('input', () => { valSpan.textContent = Math.round(rangeEl.value * 100) + '%'; });
      rangeEl.addEventListener('change', () => { st.simulation[key] = Number(rangeEl.value); DS.Storage.saveSettings(st); });
      body.append(kv(`${label}　`, el('span', { class: 'range-row' }, rangeEl, valSpan)),
        el('p', { class: 'muted small', style: 'margin:-4px 0 8px 84px' }, hintv));
    }
    // 难度
    const diffSel = el('select', { 'aria-label': '难度' },
      ...DS.DATA.DIFFICULTIES.map((d) => el('option', { value: d.id, selected: st.difficulty === d.id ? '' : null }, `${d.label} — ${d.desc}`)));
    diffSel.addEventListener('change', () => {
      st.difficulty = diffSel.value;
      DS.Storage.saveSettings(st);
      DS.UI.toast('难度将作用于新游戏；进行中的对局保持开局时难度。');
    });
    body.append(sectionTitle('难度'), kv('难度预设', diffSel),
      el('p', { class: 'muted small' }, '故事=强历史惯性；标准=均衡；困难=资源紧张执行下降；自由=弱惯性可离经叛道。'));
  }

  /* ---------------- 游戏标签页 ---------------- */
  function renderGameTab(body) {
    const st = DS.Storage.loadSettings();
    const langSel = el('select', { 'aria-label': '语言' },
      ...DS.I18N.LANGUAGES.map((l) => el('option', { value: l.id, selected: st.lang === l.id ? '' : null }, l.label)));
    langSel.addEventListener('change', () => {
      st.lang = langSel.value; DS.Storage.saveSettings(st);
      DS.I18N.setLang(langSel.value);
      DS.UI.refreshCurrent(); DS.UI.renderTopbar();
    });

    const themeSel = el('select', { 'aria-label': '主题' },
      ...[['classic', '默认古典'], ['dark', '深色'], ['light', '浅色']].map(([v, l]) =>
        el('option', { value: v, selected: st.theme === v ? '' : null }, l)));
    themeSel.addEventListener('change', () => {
      st.theme = themeSel.value; DS.Storage.saveSettings(st);
      applyTheme(st.theme);
    });

    const chk = (key, label) => {
      const cb = el('input', { type: 'checkbox' });
      cb.checked = !!st[key];
      cb.addEventListener('change', () => {
        st[key] = cb.checked; DS.Storage.saveSettings(st);
        if (key === 'reduceMotion') applyTheme(st.theme);
        if (key === 'debugMode') DS.UI.renderTopbar();
      });
      return kv(label, cb);
    };

    body.append(
      sectionTitle('通用'),
      kv('语言 / Language', langSel),
      kv('主题', themeSel),
      chk('reduceMotion', '减少动画'),
      chk('autosave', '自动保存（每回合结束）'),
      chk('debugMode', '调试模式（显示 Prompt / 响应 / Inspector）'),
    );
    const seedInfo = DS.Game.state() ? kv('当前随机种子', el('code', {}, String(DS.Game.state().seed))) : null;
    if (seedInfo) body.append(sectionTitle('随机性'), seedInfo,
      el('p', { class: 'muted small' }, '同一 Seed + 相同世界状态下，本地推演结果接近一致（固定种子）。新游戏时可指定种子。'));
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.classList.toggle('reduce-motion', !!DS.Storage.loadSettings().reduceMotion);
  }

  /* ---------------- Prompt 标签页 ---------------- */
  function renderPromptTab(body) {
    const st = DS.Storage.loadSettings();
    const defs = [
      ['worldview', '世界观 Prompt'], ['system', '系统 System Prompt'], ['npc', 'NPC Prompt'],
      ['simulation', '推演 Prompt'], ['event', '事件 Prompt'], ['summary', '总结 Prompt'],
    ];
    const boxes = {};
    for (const [key, label] of defs) {
      const ta = el('textarea', { rows: key === 'simulation' || key === 'system' ? 9 : 5, 'aria-label': label });
      ta.value = st.prompts[key] || DS.DATA.DEFAULT_PROMPTS[key] || '';
      boxes[key] = ta;
      body.append(kv(label, ta));
    }
    body.append(el('div', { class: 'row-gap' },
      el('button', {
        class: 'btn btn-primary', onclick: () => {
          for (const [key, ta] of Object.entries(boxes)) st.prompts[key] = ta.value;
          DS.Storage.saveSettings(st);
          DS.UI.toast('Prompts 已保存，下次推演生效');
        },
      }, '保存全部 Prompts'),
      el('button', {
        class: 'btn', onclick: () => DS.UI.confirmDialog('恢复全部默认 Prompt？你的修改将被覆盖。', () => {
          st.prompts = DS.util.deepClone(DS.DATA.DEFAULT_PROMPTS);
          DS.Storage.saveSettings(st);
          const host = body.closest('.view');
          if (host) settingsView.render(host);
          else { body.textContent = ''; renderPromptTab(body); }
          DS.UI.toast('已恢复默认 Prompts');
        }),
      }, '恢复默认 Prompt')));
  }

  /* ---------------- 数据标签页 ---------------- */
  function renderDataTab(body) {
    body.append(sectionTitle('数据管理'),
      kv('导出全部数据', el('button', {
        class: 'btn', onclick: exportAllData,
      }, '导出设置+剧本（不含存档）')),
      el('div', { class: 'row-gap', style: 'margin-top: .6rem' },
        el('button', {
          class: 'btn', onclick: () => {
            const st = DS.Storage.loadSettings();
            DS.util.download('dynasty-settings.json', JSON.stringify({ ...st, api: { ...st.api, profiles: st.api.profiles.map((p) => ({ ...p, apiKey: '' })) } }, null, 2));
          },
        }, '导出设置 JSON'),
        (() => {
          const inp = el('input', { type: 'file', accept: '.json', style: 'display:none' });
          const btn = el('button', {
            class: 'btn', onclick: () => inp.click(),
          }, '导入设置 JSON');
          inp.addEventListener('change', async () => {
            const f = inp.files[0]; inp.value = '';
            if (!f) return;
            try {
              const obj = JSON.parse(await DS.util.readFileText(f));
              const merged = DS.Storage.migrateSettingsPublic ? DS.Storage.migrateSettingsPublic(obj) : obj;
              DS.Storage.saveSettings(merged);
              DS.UI.toast('设置已导入（Key 未随文件保存，需重填）');
              applyTheme(DS.Storage.loadSettings().theme);
            } catch (e) { DS.UI.toast('导入失败：' + e.message, 'error'); }
          });
          const wrap = el('span', {}, btn, inp);
          return wrap;
        })()),
      el('hr'),
      kv('恢复默认设置', el('button', {
        class: 'btn btn-danger', onclick: () => DS.UI.confirmDialog('恢复全部默认设置？（不影响存档）', () => {
          DS.Storage.resetSettings();
          DS.I18N.setLang('zh-CN');
          applyTheme('classic');
          DS.UI.toast('已恢复默认设置');
        }, true),
      })),
      kv('清空全部本地数据', el('button', {
        class: 'btn btn-danger', onclick: () => DS.UI.confirmDialog('将删除所有存档、设置与剧本，且不可恢复。确定？', () => {
          DS.Storage.clearAll();
          location.reload();
        }, true),
      })));
  }

  function exportAllData() {
    const st = DS.Storage.loadSettings();
    const data = {
      kind: 'dynasty-backup',
      schemaVersion: 1,
      exportedAt: DS.util.nowISO(),
      scenarios: DS.Storage.listScenarios(),
      settings: { ...st, api: { ...st.api, profiles: st.api.profiles.map((p) => ({ ...p, apiKey: '' })) } },
    };
    DS.util.download(`dynasty-backup-${DS.util.todayStamp()}.json`, JSON.stringify(data, null, 2));
    DS.UI.toast('备份已导出（不包含 API Key 与存档正文）');
  }

  /* ---------------- 调试标签页 ---------------- */
  function renderDebugTab(body) {
    const dbg = DS.aiService.debug;
    const state = DS.Game.state();
    const enabled = DS.Storage.loadSettings().debugMode;

    if (!enabled) {
      body.append(el('div', { class: 'callout' }, '调试模式未开启。请在「游戏」标签页勾选「调试模式」以解锁 Simulation Inspector。'));
      return;
    }
    body.append(sectionTitle('Simulation Inspector（开发者）'));

    const block = (title, contentNode) => {
      const det = el('details', { class: 'dbg-block' }, el('summary', {}, title), contentNode);
      body.append(det);
      return det;
    };

    if (state) {
      block('World State（截断显示）', el('pre', { class: 'snippet' }, DS.util.trunc(JSON.stringify(state, null, 2), 60000)));
      block('NPC State', el('pre', { class: 'snippet' }, JSON.stringify(state.characters.map((c) => ({
        id: c.id, name: c.name, role: c.role, faction: c.faction, loyalty: Math.round(c.loyalty), trust: Math.round(c.trust), corruption: c.corruption, task: c.task,
      })), null, 2)));
      block('Faction State', el('pre', { class: 'snippet' }, JSON.stringify(state.factions, null, 2)));
      block('Event Queue（pendingEvents）', el('pre', { class: 'snippet' }, JSON.stringify(state.pendingEvents, null, 2)));
      block('Long-term Memory', el('pre', { class: 'snippet' }, JSON.stringify(state.longTermMemory, null, 2)));
    } else {
      body.append(emptyHint('尚未开始游戏。'));
    }

    block('最后一次 Prompt（AI Context 分层）', el('pre', { class: 'snippet' }, dbg.lastPrompt
      ? `[${dbg.lastPrompt.purpose}] @${dbg.lastPrompt.at}\n--- SYSTEM ---\n${DS.util.trunc(dbg.lastPrompt.system, 6000)}\n--- USER ---\n${DS.util.trunc(dbg.lastPrompt.user, 12000)}`
      : '（尚无请求）'));
    block('最后一次 AI Response', el('pre', { class: 'snippet' }, dbg.lastResponse || '（尚无响应）'));
    block('请求统计', el('pre', { class: 'snippet' }, JSON.stringify({
      requestUrl: dbg.requestUrl, latencyMs: dbg.latencyMs, usage: dbg.usage, parseStatus: dbg.parseStatus,
    }, null, 2)));
  }

  DS.Views = {
    world: worldView, court: courtView, characters: charsView, policies: policiesView,
    events: eventsView, diplomacy: diploView, history: historyView, saves: savesView,
    settings: settingsView, showApiError, applyTheme,
  };
})(window.DynastySim = window.DynastySim || {});

</script>
<script>
/* ============================================================================
 * game.js — 游戏编排层
 * ----------------------------------------------------------------------------
 * 核心循环：观察天下 → 廷议 → 自然语言下诏 → AI/Mock 推演 → 验证 → 应用状态
 *           → 事件与历史记录 → 结束回合（时间推进）→ 下一回合。
 * 本文件是唯一把 AI 层、状态层、UI 层粘合在一起的地方。
 * ==========================================================================*/
(function (DS) {
  'use strict';
  const { el } = DS.util;

  /** 本文件专用的行式键值 / 进度条小组件（与 views.js 内部实现保持一致观感） */
  function kv(label, valueNode) {
    return el('div', { class: 'kv' }, el('span', { class: 'kv-k' }, label), el('span', { class: 'kv-v' }, valueNode));
  }
  function bar(v, cls, label) {
    const pct = DS.util.clamp(Math.round(v), 0, 100);
    return el('div', { class: 'bar-wrap' },
      el('div', { class: `bar ${cls || ''}`, style: `width:${pct}%` }),
      el('span', { class: 'bar-num' }, String(pct)));
  }

  let _state = null;
  let lastAutosaveAt = 0;
  let endingShown = false;

  /* ============================ 开局 ============================ */
  function newGame(cfg) {
    _state = DS.State.createNewGame(cfg);
    endingShown = false;
    // 剧本引子写入历史
    DS.State.recordHistory(_state, { type: 'system', title: '引子', description: DS.util.trunc(DS.DATA.prologue({
      year: _state.date.year, dynastyName: _state.dynasty.name, eraName: _state.ruler.eraName, rulerName: _state.ruler.name,
    }), 380) });
    enterGame();
    // 展示剧情引子
    DS.UI.modal({
      title: `序章 · ${_state.dynasty.name}${_state.ruler.eraName}元年`,
      wide: true,
      build(body) {
        const pre = document.createElement('pre');
        pre.className = 'prologue';
        pre.textContent = DS.DATA.prologue({
          year: _state.date.year, dynastyName: _state.dynasty.name, eraName: _state.ruler.eraName, rulerName: _state.ruler.name,
        });
        body.append(pre);
      },
      actions: [{ label: '开始亲政 ▶', primary: true }],
    });
    autoSave('开局');
  }

  function enterGame() {
    document.querySelector('#welcome-screen').hidden = true;
    document.querySelector('#app').hidden = false;
    DS.Views.applyTheme(DS.Storage.loadSettings().theme);
    DS.UI.renderTopbar();
    DS.UI.showView('world');
  }

  function state() { return _state && !_state.gameOver ? _state : (_state || null); }
  /** 终局后仍允许查看，但禁止发布政令 */
  function rawState() { return _state; }

  /* ============================ 发布政令 ============================ */
  async function submitOrder(text) {
    text = String(text || '').trim();
    if (!rawState()) { DS.UI.toast(DS.I18N.t('no_game'), 'warn'); return; }
    if (rawState().gameOver) { DS.UI.toast('大位已终，无法再下诏。可读取存档或开始新游戏。', 'warn'); return; }
    if (!text) { DS.UI.toast(DS.I18N.t('order_empty'), 'warn'); return; }
    if (DS.UI.isBusy()) return;

    DS.UI.setBusy(true);
    const abortCtrl = new AbortController();
    DS.UI.loading(true, {
      cancellable: true,
      onCancel: () => { abortCtrl.abort(new DOMException('cancelled', 'AbortError')); },
    });

    try {
      const st = rawState();
      const isMock = DS.aiService.isActiveMock('simulation');

      // ① 取得推演 JSON（AI 或 Mock 同构）
      let parsed;
      if (isMock) {
        const out = await DS.aiService.chatRaw('simulation', '', '', {
          mockKind: 'order', mockState: st, mockPayload: { text }, signal: abortCtrl.signal,
        });
        parsed = DS.AI.extractJSON(out.text);
        if (!parsed) throw new DS.AI.AIError('Demo 引擎输出异常', { kind: 'parse' });
        DS.aiService.debug.parseStatus = '本地引擎生成';
      } else {
        const { system, user } = DS.AI.PromptBuilder.simulation(st, text);
        parsed = await DS.aiService.chatJSON('simulation', system, user, {
          mockKind: 'order', mockState: st, mockPayload: { text }, signal: abortCtrl.signal,
        });
      }

      // ② 校验（不合格则整体拒绝，不触碰状态）
      const check = DS.State.validateAIResult(parsed, st);
      if (!check.ok) throw new DS.AI.AIError('推演结果校验未通过：' + (check.errors || []).join('；'), { kind: 'parse' });
      const result = check.value;
      if (check.warnings.length) {
        console.warn('[推演警告]', check.warnings.join('；'));
      }

      // ③ 应用（唯一入口：apply* 系列）
      const applyInfo = applySimulationResult(st, result, text);

      // ④ 反馈
      const applied = applyInfo;
      DS.UI.clearOrderInput();
      DS.UI.renderTopbar();
      DS.UI.refreshCurrent();
      showOrderResult(result, check.warnings, applied);
      autoSave('政令后');
    } catch (err) {
      handleRuntimeError(err);
    } finally {
      DS.UI.loading(false);
      DS.UI.setBusy(false);
    }
  }

  /** 把验证过的结果写入世界（含事件、人物、地区、长期后果、史册） */
  function applySimulationResult(st, result, originalText) {
    const C = st.country;
    // 政令本身入史
    DS.State.recordHistory(st, {
      type: 'order',
      title: `帝下诏：${result.intent && result.intent.category ? result.intent.category : '谕令'}`,
      description: DS.util.trunc(originalText, 160),
    });

    const changeSummary = {};
    // 主状态变化
    Object.assign(changeSummary, DS.State.applyChanges(st, result.state_changes, { reason: result.turn_summary || '政令' }));
    // 附带事件的直接效果
    for (const ev of result.events) {
      DS.State.addEvent(st, { ...ev, category: ev.category || '政令事件', source: 'edict' });
      if (ev.effects) Object.assign(changeSummary, DS.State.applyChanges(st, ev.effects, { reason: ev.title }));
    }
    // 人物 / 地区
    const npcApplied = DS.State.applyNpcChanges(st, result.npc_changes, result.turn_summary);
    const regApplied = DS.State.applyRegionalChanges(st, result.regional_changes, result.turn_summary);
    // 长期后果 → 事件队列
    for (const fc of result.future_consequences) {
      DS.State.addPendingEvent(st, { ...fc, source: 'ai' });
    }
    // 风险提示 → 记忆与史册
    for (const risk of result.new_risks) {
      if (!st.longTermMemory.includes(risk)) {
        st.longTermMemory.unshift(risk);
        if (st.longTermMemory.length > 12) st.longTermMemory.length = 12;
      }
    }
    if (result.historical_record) {
      DS.State.recordHistory(st, { type: 'event', title: '史官记', description: result.historical_record });
    }
    st.flags.lastOrderCategory = result.intent ? result.intent.category : null;
    st.stats.ordersIssued++;
    return { changeSummary, npcApplied, regApplied };
  }

  function showOrderResult(result, warnings, applied) {
    const npcApplied = (applied && applied.npcApplied) || [];
    const regApplied = (applied && applied.regApplied) || [];
    DS.UI.modal({
      title: `📜 推演结果 · ${result.turn_summary || ''}`,
      wide: true,
      build(body) {
        body.append(
          el('p', { class: 'narrative' }, result.narrative || ''),
          result.decisions && result.decisions.length
            ? el('div', {}, el('strong', {}, '决定：'),
              el('ul', { class: 'mini-list' }, ...result.decisions.map((d) => el('li', {}, d))))
            : null,
          deltaGrid(changeSummaryOf(result)),
          (npcApplied.length || regApplied.length) ? el('h4', {}) : null,
          npcApplied.length ? kvList('臣工反应', npcApplied.map((n) => `${n.name}：${n.detail}`)) : null,
          regApplied.length ? kvList('地方变化', regApplied.map((n) => `${n.name}：${n.detail}`)) : null,
          result.events && result.events.length ? el('h4', {}, '伴随事件') : null,
          ...(result.events || []).map((e) => el('p', { class: 'event-inline' }, `[${e.severity}] ${e.title} — ${e.description}`)),
          (result.new_risks && result.new_risks.length) ? el('div', { class: 'callout callout-warn' }, '新增隐患：' + result.new_risks.join('；')) : null,
          (warnings && warnings.length) ? el('details', { class: 'dbg-block' }, el('summary', {}, `解析警告（${warnings.length}）`),
            el('pre', { class: 'snippet' }, warnings.join('\n'))) : null,
        );
      },
      actions: [{ label: '知道了', primary: true }],
    });
  }
  function changeSummaryOf(result) {
    // 汇总主变化 + 事件效果用于展示
    const merged = {};
    for (const [k, v] of Object.entries(result.state_changes)) merged[k] = (merged[k] || 0) + v;
    for (const e of result.events || []) for (const [k, v] of Object.entries(e.effects || {})) merged[k] = (merged[k] || 0) + v;
    return merged;
  }
  function deltaGrid(merged) {
    const names = {
      treasury: ['国库', fmtDeltaRes], food: ['粮食', fmtDeltaRes], population: ['人口', fmtDeltaRes],
      publicSupport: ['民心', fmtDeltaPct], stability: ['稳定', fmtDeltaPct], corruption: ['腐败', fmtDeltaPct],
      bureaucracy: ['官僚效率', fmtDeltaPct], militaryPower: ['军力', fmtDeltaPct], morale: ['士气', fmtDeltaPct],
      authority: ['皇权', fmtDeltaPct], borderPressure: ['边压', fmtDeltaPct], debt: ['国债', fmtDeltaRes],
    };
    const entries = Object.entries(merged).filter(([k, v]) => Math.abs(v) >= 0.5);
    if (!entries.length) return el('p', { class: 'muted' }, '本回合核心指标无明显变化。');
    return el('div', { class: 'delta-grid' },
      ...entries.map(([k, v]) => {
        const [label, fn] = names[k] || [k, (x) => String(Math.round(x * 10) / 10)];
        return el('span', { class: `delta-pill ${v > 0 ? 'up' : 'down'}` }, `${label} ${fn(v)}`);
      }));
  }
  function fmtDeltaPct(v) { return (v > 0 ? '+' : '') + Math.round(v * 10) / 10; }
  function fmtDeltaRes(v) { return (v > 0 ? '+' : '') + DS.util.fmtMoney(v); }
  function kvList(title, items) {
    return el('div', {}, el('strong', {}, title),
      el('ul', { class: 'mini-list' }, ...items.map((x) => el('li', {}, x))));
  }

  /* ============================ 廷议 ============================ */
  async function runCouncil(charIds) {
    if (!rawState() || !charIds.length) return;
    if (DS.UI.isBusy()) return;
    DS.UI.setBusy(true);
    try {
      const st = rawState();
      const isMock = DS.aiService.isActiveMock('dialogue');
      let council;
      if (isMock) {
        const out = await DS.aiService.chatRaw('dialogue', '', '', { mockKind: 'council', mockState: st, mockPayload: { charIds } });
        council = DS.AI.extractJSON(out.text);
      } else {
        const { system, user } = DS.AI.PromptBuilder.council(st, charIds);
        council = await DS.aiService.chatJSON('dialogue', system, user, {});
      }
      if (!council || !Array.isArray(council.speeches) || !council.speeches.length) {
        throw new DS.AI.AIError('廷议返回格式异常', { kind: 'parse', suggestion: '重试一次，或切换到本地 Demo 引擎。' });
      }
      st.councilLog.unshift({
        date: DS.util.dateLabel(st.date),
        turn: st.turn,
        consensus: council.consensus || '各有主张',
        speeches: council.speeches.slice(0, 3).map((s) => ({
          characterId: s.characterId || (s.id ?? ''),
          name: s.name || '', role: s.role || '',
          stance: s.stance || '', support: s.support || 'cautious',
          content: String(s.content || '').slice(0, 400),
        })).filter((s) => DS.State.getCharacter(st, s.characterId)),
      });
      if (st.councilLog.length > 12) st.councilLog.length = 12;
      DS.State.recordHistory(st, { type: 'event', title: '召对廷臣', description: `召${st.councilLog[0].speeches.map((s) => s.name).join('、')}廷议，${st.councilLog[0].consensus}。` });
      DS.UI.refreshCurrent();
      autoSave('廷议后');
    } catch (err) {
      handleRuntimeError(err);
    } finally {
      DS.UI.setBusy(false);
    }
  }

  /** 采纳某臣廷议：填入圣旨框并记录信任 */
  function adoptAdvice(charId, content) {
    const st = rawState();
    const c = DS.State.getCharacter(st, charId);
    if (!c) return;
    const core = String(content || '').replace(/^臣[^：:]{0,6}[：:]?/, '').trim();
    const draft = core.slice(0, 80) + (core.length > 80 ? '……' : '');
    const input = document.querySelector('#order-input');
    input.value = `依${c.name}所奏：${draft}`;
    input.dispatchEvent(new Event('input'));
    input.focus();
    DS.State.applyNpcChanges(st, [{ id: charId, trust_delta: 3, reason: '陛下当廷采纳其建议（草拟中）' }]);
    DS.UI.toast(`已按 ${c.name} 之意草拟圣旨，可自行修改后颁布。`, 'info');
    DS.UI.renderTopbar();
  }

  /* ============================ NPC 对话 ============================ */
  async function talkTo(charId, message) {
    const st = rawState();
    const c = DS.State.getCharacter(st, charId);
    if (!c) return Promise.resolve();
    c.dialogueMemory.push(`【陛下】${message}`);
    if (c.dialogueMemory.length > 10) c.dialogueMemory.shift();
    try {
      const isMock = DS.aiService.isActiveMock('dialogue');
      let replyObj;
      if (isMock) {
        const out = await DS.aiService.chatRaw('dialogue', '', '', {
          mockKind: 'dialogue', mockState: st, mockPayload: { charId, message },
        });
        replyObj = DS.AI.extractJSON(out.text);
      } else {
        const { system, user } = DS.AI.PromptBuilder.dialogue(st, charId, message, c.dialogueMemory);
        replyObj = await DS.aiService.chatJSON('dialogue', system, user, { temperature: 0.9, maxTokens: 500 });
      }
      const reply = replyObj && replyObj.reply ? String(replyObj.reply) : '……（沉默不语。）';
      const attitude = replyObj && replyObj.attitude ? replyObj.attitude : '';
      c.dialogueMemory.push(`【${c.name}${attitude ? '·' + attitude : ''}】${reply}`);
      if (replyObj && isFinite(Number(replyObj.trust_delta))) {
        DS.State.applyNpcChanges(st, [{ id: charId, trust_delta: Number(replyObj.trust_delta), reason: '君臣召对' }]);
      }
      DS.UI.renderTopbar();
    } catch (err) {
      c.dialogueMemory.push(`【${c.name}】（侍立无言——${err.message}）`);
      handleRuntimeError(err);
    }
  }

  /** 缇骑密查秘密：成败皆有后果 */
  function investigateSecret(charId) {
    const st = rawState();
    const c = DS.State.getCharacter(st, charId);
    if (!c || !c.secrets.length) return;
    const spy = st.characters.find((x) => x.role === '锦衣卫指挥使');
    const successChance = 0.55 + (spy ? spy.ability / 300 : 0.1);
    if (Math.random() < successChance) {
      st.flags.revealedSecrets.push(charId);
      DS.UI.modal({
        title: `缇骑回报 · ${c.name}`,
        build(body) { body.append(el('p', {}, c.secrets.join('；'))); },
        actions: [{ label: '朕知道了', primary: true }],
      });
      DS.State.recordHistory(st, { type: 'relation', title: `缇骑密查${c.name}得手`, description: `查明隐情：${c.secrets[0]}` });
    } else {
      DS.State.applyNpcChanges(st, [{ id: charId, trust_delta: -6, reason: '风闻缇骑暗查，心生疑惧' }]);
      DS.UI.toast('密查走漏了风声，对方有所警觉（信任下降）。', 'warn');
    }
  }

  /* ============================ 国策 ============================ */
  function adoptPolicy(pid) {
    const st = rawState();
    if (!st || st.gameOver) return;
    const p = st.policiesKnown.find((x) => x.id === pid);
    if (!p || st.activePolicies.includes(pid)) return;
    const missing = (p.prereq || []).filter((id) => !st.activePolicies.includes(id));
    if (missing.length) { DS.UI.toast('前置国策未满足。', 'warn'); return; }
    if (st.country.treasury < p.cost) { DS.UI.toast('国库不足以推行此策。', 'warn'); return; }
    DS.UI.confirmDialog(`推行「${p.name}」？需国帑 ${DS.util.fmtMoney(p.cost)}。`, () => {
      DS.State.applyChanges(st, { treasury: -p.cost }, { reason: `推行国策：${p.name}` });
      DS.State.applyChanges(st, p.instant || {}, { reason: `国策生效：${p.name}` });
      st.activePolicies.push(pid);
      st.stats.policiesAdopted++;
      DS.State.recordHistory(st, { type: 'policy', title: `推行国策：${p.name}`, description: p.side || '' });
      DS.UI.toast(`「${p.name}」已推行`, 'success');
      DS.UI.renderTopbar();
      DS.UI.refreshCurrent();
      autoSave('国策后');
    });
  }

  /* ============================ 结束回合 ============================ */
  async function endTurn() {
    if (!rawState()) return;
    if (DS.UI.isBusy()) return;
    DS.UI.setBusy(true);
    try {
      const st = rawState();
      const report = DS.State.advanceMonth(st);
      DS.UI.renderTopbar();
      DS.UI.refreshCurrent();

      // 回合小结
      const lines = [];
      lines.push(`岁入 ${DS.util.fmtMoney(report.income)} ／ 岁出 ${DS.util.fmtMoney(report.expense)}（${report.netIncome >= 0 ? '盈余' : '亏空'} ${DS.util.fmtMoney(Math.abs(report.netIncome))}）`);
      if (report.notes.length) lines.push(...report.notes);
      if (report.firedEvents.length) lines.push('触发事件：' + report.firedEvents.join('、'));
      DS.UI.toast(lines.join('\n'), report.netIncome >= 0 ? 'info' : 'warn', 5200);

      autoSave('回合末');
      if (st.gameOver && !endingShown) { endingShown = true; await showEnding(st.gameOver, true); }
    } catch (err) {
      handleRuntimeError(err);
    } finally {
      DS.UI.setBusy(false);
    }
  }

  /* ============================ 终局 ============================ */
  async function showEnding(ending, final) {
    let verdictText = '（本地评语）' ;
    try {
      const st = rawState();
      if (!DS.aiService.isActiveMock('summary')) {
        const { system, user } = DS.AI.PromptBuilder.summary(st, ending);
        const out = await DS.aiService.chatRaw('summary', system, user, { maxTokens: 800 });
        verdictText = out.text.trim();
      } else {
        const o = await DS.aiService.chatRaw('summary', '', '', { mockKind: 'verdict', mockState: st, mockPayload: { ending } });
        verdictText = o.text;
      }
    } catch (_e) { verdictText = '史官执笔踌躇，一时未能成文。（AI 评语获取失败）'; }

    DS.UI.modal({
      title: `${ending.icon} 帝王生涯评价 · ${ending.label}`,
      wide: true,
      dismissable: false,
      build(body) {
        const sc = ending.scores;
        const dims = [['economy', '经济'], ['livelihood', '民生'], ['military', '军事'], ['political', '政治'], ['diplomatic', '外交'], ['reform', '改革'], ['stabilityScore', '稳定']];
        body.append(
          el('p', { class: 'narrative' }, ending.desc),
          el('div', { class: 'kv-grid' },
            ...dims.map(([k, label]) => kv(label, bar(sc[k] || 0, '', label)))),
          el('div', { class: 'kv-grid' },
            kv('在位年数', `${ending.stats.reignYears} 年（${ending.stats.turns} 回合）`),
            kv('颁布政令', `${ending.stats.orders} 道`),
            kv('推行国策', `${ending.stats.policies} 项`),
            kv('记录事件', `${ending.stats.events} 起`),
            kv('实录条目', `${ending.stats.historyEntries} 条`),
            kv('随机种子', String(ending.stats.seed))),
          el('h4', {}, '史官评语'),
          el('pre', { class: 'prologue' }, verdictText),
        );
      },
      actions: final
        ? [
          { label: '读取存档', onClick: () => { DS.UI.showView('saves'); } },
          { label: '开启新王朝', primary: true, onClick: () => backToWelcome(true) },
        ]
        : [{ label: '退朝', primary: true }],
    });
  }

  function abdicate() {
    const st = rawState();
    if (!st) return;
    const ending = DS.State.evaluateEnding(st);
    showEnding(ending, false);
  }

  /* ============================ 存档 ============================ */
  function autoSave(label) {
    const stg = DS.Storage.loadSettings();
    if (!stg.autosave || !rawState()) return;
    const now = Date.now();
    if (now - lastAutosaveAt < 20000) return; // 节流 20s
    lastAutosaveAt = now;
    const r = DS.Storage.writeSave('auto', rawState(), label || '自动保存');
    if (!r.ok) DS.UI.toast(r.error, 'error');
  }

  function quickSave() {
    const slots = DS.Storage.SLOTS.filter((s) => s !== 'auto');
    const empty = DS.Storage.listSaves().find((m) => m.empty && m.slot !== 'auto');
    const target = empty ? empty.slot : 'slot1';
    saveToSlot(target);
  }

  function saveToSlot(slot) {
    if (!rawState()) { DS.UI.toast(DS.I18N.t('no_game'), 'warn'); return; }
    const r = DS.Storage.writeSave(slot, rawState(), '');
    if (r.ok) DS.UI.toast(`${DS.I18N.t('saved_ok', { slot })}`, 'success');
    else DS.UI.toast(r.error, 'error');
    if (DS.UI.currentView === 'saves') DS.UI.refreshCurrent();
  }

  function loadSlot(slot) {
    const r = DS.Storage.readSave(slot);
    if (!r) { DS.UI.toast('该存档为空。', 'warn'); return; }
    if (r.corrupt) { DS.UI.toast('存档已损坏：' + r.error, 'error'); return; }
    _state = r.state;
    endingShown = false;
    if (r.checksumMismatch) DS.UI.toast('⚠ 该存档校验和不匹配，可能被手动修改过。', 'warn', 6000);
    enterGame();
    DS.UI.toast(`已读取存档：${slot}`, 'success');
  }

  function backToWelcome(force) {
    const go = () => {
      autoSave('返回主菜单');
      document.querySelector('#app').hidden = true;
      document.querySelector('#welcome-screen').hidden = false;
    };
    if (force) go();
    else DS.UI.confirmDialog('返回主菜单？（进度会先自动保存到 auto 槽）', go);
  }

  /* ============================ 错误处理 ============================ */
  function handleRuntimeError(err) {
    if (err instanceof DS.AI.AIError) {
      if (err.kind === 'cancel') { DS.UI.toast('已取消本次推演。', 'info'); return; }
      DS.Views.showApiError(err);
      return;
    }
    console.error(err);
    DS.UI.toast('发生意外错误：' + (err && err.message ? err.message : err), 'error', 6000);
  }

  DS.Game = {
    newGame, state, rawState,
    submitOrder, runCouncil, adoptAdvice, talkTo, investigateSecret,
    adoptPolicy, endTurn, abdicate,
    quickSave, saveToSlot, loadSlot, backToWelcome,
    showEnding,
  };
})(window.DynastySim = window.DynastySim || {});

</script>
<script>
/* ============================================================================
 * app.js — 启动引导
 * ----------------------------------------------------------------------------
 * · 绑定欢迎界面（新游戏/读取/API设置/说明/Demo）
 * · 新游戏配置表单（剧本、王朝、年号、难度、种子）
 * · 应用主题与语言；注入 UI 事件处理器
 * ==========================================================================*/
(function (DS) {
  'use strict';
  const { el, qs } = DS.util;

  document.addEventListener('DOMContentLoaded', () => {
    const st = DS.Storage.loadSettings();
    DS.I18N.setLang(st.lang || 'zh-CN');
    DS.Views.applyTheme(st.theme);
    DS.UI.init({
      submitOrder: (text) => DS.Game.submitOrder(text),
      endTurn: () => DS.Game.endTurn(),
    });

    // 欢迎界面按钮
    qs('#w-btn-new').addEventListener('click', openNewGameForm);
    qs('#w-btn-load').addEventListener('click', () => {
      const auto = DS.Storage.readSave('auto');
      if (auto && !auto.corrupt) {
        DS.Game.loadSlot('auto');
        return;
      }
      enterAppThen(() => DS.UI.showView('saves'));
    });
    qs('#w-btn-api').addEventListener('click', () => {
      enterAppThen(() => DS.UI.showView('settings'));
    });
    qs('#w-btn-help').addEventListener('click', () => DS.UI.helpDialog());
    qs('#w-btn-demo').addEventListener('click', () => {
      // 确保三个用途都指向本地引擎
      const s = DS.Storage.loadSettings();
      for (const k of Object.keys(s.api.purposes)) s.api.purposes[k] = 'mock_local';
      DS.Storage.saveSettings(s);
      DS.UI.toast('已切换到本地 Demo 推演模式（无需任何 API）。', 'info');
      openNewGameForm(true);
    });

    // 若存在自动存档，在欢迎页追加「继续统治」
    const autoMeta = DS.Storage.listSaves().find((m) => m.slot === 'auto');
    if (autoMeta && !autoMeta.empty && !autoMeta.corrupt) {
      const btn = el('button', {
        class: 'btn btn-lg btn-primary',
        onclick: () => DS.Game.loadSlot('auto'),
      }, `⏵ 继续：${autoMeta.meta.dynasty || ''}·${autoMeta.meta.date || ''}`);
      qs('.welcome-actions').prepend(btn);
    }
  });

  function enterAppThen(fn) {
    qs('#welcome-screen').hidden = true;
    qs('#app').hidden = false;
    if (!DS.Game.rawState()) {
      // 未开局时只允许看设置/存档，不给空世界渲染视图
      fn();
      return;
    }
    DS.UI.renderTopbar();
    fn();
  }

  /* ============================ 新游戏表单 ============================ */
  function openNewGameForm(demoMode) {
    const st = DS.Storage.loadSettings();
    const scenarios = [...DS.DATA.SCENARIOS, ...DS.Storage.listScenarios()];

    const F = {};
    const field = (key, label, value, opts = {}) => {
      const inp = opts.rows
        ? el('textarea', { rows: opts.rows, value: value || '', placeholder: opts.ph || '', 'aria-label': label })
        : el('input', { type: opts.type || 'text', value: value != null ? String(value) : '', placeholder: opts.ph || '', 'aria-label': label });
      F[key] = inp;
      return kvRow(label, inp);
    };
    function kvRow(label, node) {
      return el('div', { class: 'kv' }, el('span', { class: 'kv-k' }, label), el('span', { class: 'kv-v' }, node));
    }

    const scSel = el('select', { 'aria-label': '选择剧本' },
      ...scenarios.map((sc) => el('option', { value: sc.id }, `${sc.name}${sc.builtin ? '' : '（自定义）'}`)));
    const diffWrap = el('select', { 'aria-label': '难度' },
      ...DS.DATA.DIFFICULTIES.map((d) => el('option', { value: d.id, selected: d.id === st.difficulty ? '' : null },
        `${d.label} — ${d.desc}`)));

    let curSc = scenarios[0];
    const descP = el('p', { class: 'muted small scenario-desc' }, curSc.desc);
    scSel.addEventListener('change', () => {
      curSc = scenarios.find((s) => s.id === scSel.value) || curSc;
      descP.textContent = curSc.desc;
      F.dynasty.value = curSc.dynastyName || '';
      F.country.value = curSc.countryName || '';
      F.ruler.value = curSc.rulerName || '';
      F.era.value = curSc.eraName || '';
      F.year.value = curSc.year || 1627;
    });

    DS.UI.modal({
      title: demoMode ? '新游戏（本地 Demo 推演）' : '开创新王朝',
      wide: true,
      build(body) {
        body.append(
          kvRow('剧本', scSel), descP,
          field('dynasty', '王朝名称', '大晟'),
          field('country', '国家称号', '大晟帝国'),
          field('ruler', '统治者姓名', '萧承稷'),
          field('era', '年号', '景明'),
          field('year', '起始年份', 1627, { type: 'number' }),
          kvRow('难度', diffWrap),
          field('seed', '随机种子（留空则随机）', '', { ph: '例如 1627' }),
          field('intro', '自定义历史背景（可选，将写入 AI 上下文）', '', { rows: 3, ph: '可描述你的架空世界设定……' }),
          demoMode ? el('div', { class: 'callout' }, '当前为本地 Demo 推演模式：由内置规则引擎模拟政令后果，无需 API。') : null,
        );
      },
      actions: [
        { label: '取消' },
        {
          label: '▶ 登基', primary: true, onClick: (close) => {
            const cfg = {
              dynastyName: F.dynasty.value.trim().slice(0, 12) || undefined,
              countryName: F.country.value.trim().slice(0, 20) || undefined,
              rulerName: F.ruler.value.trim().slice(0, 12) || undefined,
              eraName: F.era.value.trim().slice(0, 6) || undefined,
              year: parseInt(F.year.value, 10),
              difficulty: diffWrap.value,
              scenarioId: scSel.value,
              intro: F.intro.value.trim().slice(0, 600),
              seed: /^[0-9]+$/.test(F.seed.value.trim()) ? parseInt(F.seed.value, 10) >>> 0 : undefined,
            };
            if (!isFinite(cfg.year) || cfg.year < 1 || cfg.year > 2200) {
              DS.UI.toast('起始年份不合法（1～2200）。', 'warn');
              return;
            }
            close();
            DS.Game.newGame(cfg);
          },
        },
      ],
    });
  }

  DS.App = { openNewGameForm };
})(window.DynastySim = window.DynastySim || {});

</script>
</body>
