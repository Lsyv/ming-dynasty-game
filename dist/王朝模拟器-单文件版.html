  function runCouncil(state, charIds) {
    const rng = rngFor(state, 'council' + charIds.join(','));
    const openings = ['臣启陛下：', '臣谨对：', '臣愚昧之见：', '臣冒死陈言：', '臣俯伏奏闻：'];
    const speeches = charIds.map((id, i) => {
      const c = DS.State.getCharacter(state, id);
      if (!c) return null;
      const view = ROLE_VIEWS[c.role] ? ROLE_VIEWS[c.role](state) : {
        stance: '依违其间', support: 'cautious',
        line: '臣职分所在，不敢旁骛。惟愿陛下乾纲独断，臣等谨遵奉行。',
      };
      return {
        characterId: c.id,
        name: c.name,
        role: c.role,
        faction: c.faction,
        stance: view.stance,
        support: view.support,
        content: openings[(i + Math.floor(rng() * openings.length)) % openings.length] + view.line,
      };
    }).filter(Boolean);
    return {
      speeches,
      consensus: speeches.every((x) => x.support === 'support') ? '众议佥同'
        : speeches.some((x) => x.support === 'support') ? '各有主张' : '莫衷一是',
      advice_summary: '以上诸臣之言，供陛下圣裁。采纳某议可直接写入圣旨。',
    };
  }

  /* ============================ NPC 对话 ============================ */
  function dialogue(state, charId, message) {
    const c = DS.State.getCharacter(state, charId);
    if (!c) return { reply: '……（此人不在朝中。）', attitude: '困惑', trust_delta: 0 };
    const rng = rngFor(state, 'dlg' + charId + message);
    const C = state.country;
    const m = message || '';

    // 秘密保护：除非已在 flags.revealedSecrets，否则绝不提及
    const knowsSecret = (state.flags.revealedSecrets || []).includes(c.id);

    let reply;
    if (/财|库|银|钱|税|饷/.test(m)) {
      reply = `陛下垂询财政。如今太仓存银 ${DS.util.fmtRes(C.treasury, '两')}，各处请讨文书却堆积如案。臣以为，开源不如节流，节流不如清源——把${C.corruption > 50 ? '那些层层伸手的手' : '冗费'}清一清，比加派百姓强得多。`;
    } else if (/边|敌|狄|战|兵|防/.test(m)) {
      reply = `边事臣不敢欺瞒：${[...state.diplomacy].sort((a, b) => b.borderPressure - a.borderPressure)[0].name}压境，边压已近 ${Math.round(C.borderPressure)}。我军力 ${Math.round(C.militaryPower)}，勉强自守有余，远征则不足。将帅能战，但士兵要吃饭。`;
    } else if (/灾|荒|民|饿|赈/.test(m)) {
      const dis = state.regions.filter((r) => r.disaster);
      reply = dis.length
        ? `灾情最重的仍是${dis.map((r) => r.name + r.disaster.type).join('、')}。臣接得塘报，流民扶老携幼，道殣相望……乞陛下速断，迟一月便多白骨一山。`
        : `托陛下洪福，眼下诸路未有急灾。但常平仓空虚，一旦年景不好，悔之晚矣，宜早蓄积。`;
    } else if (/贪|腐|奸|查/.test(m)) {
      reply = C.corruption >= 50
        ? '（左右看了看，压低声音）陛下既问到这层……官场积弊已深，臣只能说：水至清则无鱼。若陛下决意痛惩，臣万死不辞；只是牵连必广，还望圣心默运。'
        : '近来吏治还算安静，偶有小案，都已按律发落。若陛下要立威，臣以为宜择典型，不必广株连。';
    } else if (/朕|忠|你对我|信任/.test(m)) {
      reply = c.loyalty >= 70
        ? '臣蒙陛下信任，敢不肝脑涂地。只是臣年老体衰，恐怕侍奉陛下的日子一天少过一天，唯愿陛下早用贤才。'
        : '臣……世受国恩，自当尽力。（目光微微躲闪）朝局复杂，臣所言未必皆可采信，还望陛下明察。';
    } else if (/建议|策|如何|怎么办|你看/.test(m)) {
      const worstR = [...state.regions].sort((a, b) => b.unrest - a.unrest)[0];
      reply = `臣僭越说一句：当务之急有三——其一，${worstR.name}乱险最高，宜先安抚；其二，${C.treasury < 150000 ? '库藏见底，速筹开源' : '库藏虽可支，亦当未雨绸缪'}；其三，${C.morale < 50 ? '军心不稳，饷不可欠' : '边军尚稳，可徐图恢复'}。三事有序，天下可安。`;
    } else {
      reply = DS.util.pick(rng, [
        '臣谨聆圣训。臣职司本衙，凡有所命，敢不夙夜匪懈。',
        '陛下圣明。此事容臣回去核查卷册，明日再详细回奏。',
        '臣愚钝，一时拿不准，不敢妄对。容臣思之三日后复命。',
        '（长揖）陛下宵衣旰食，臣等敢不效死。惟愿善保圣躬。',
      ]);
    }
    if (knowsSecret && c.secrets.length && rng() < 0.5) {
      reply += '（低声）至于臣心中所讳的那件事……陛下既然已知，臣无所逃罪，唯凭圣裁。';
    }
    return { reply, attitude: c.loyalty >= 70 ? '恳切' : c.loyalty >= 50 ? '恭谨' : '疏离', trust_delta: 1 };
  }

  /* ============================ 史官评语 ============================ */
  function verdict(state, ending) {
    const sc = ending.scores;
    const bestDim = Object.entries(sc).sort((a, b) => b[1] - a[1])[0][0];
    const dimName = { economy: '理财', livelihood: '恤民', military: '武功', political: '御下', diplomatic: '驭夷', reform: '变法', stabilityScore: '持盈' }[bestDim] || '守成';
    const years = ending.stats.reignYears;
    const tone = ['golden', 'revival', 'reform'].includes(ending.id) ? '褒'
      : ['replace', 'collapse', 'split'].includes(ending.id) ? '贬' : '平';
    const open = tone === '褒'
      ? `史臣曰：上践祚以来，御宇${years}载，励精图治。`
      : tone === '贬' ? `史臣曰：上即位以来，${years}载之间，风波迭起。`
      : `史臣曰：上临御${years}载，无功过之尤者。`;
    const mid = `其所长者${dimName}也；${sc.political < 50 ? '然御下乏术，权移于下。' : ''}${sc.livelihood < 50 ? '民生凋敝，赈济不时，此其失也。' : ''}${sc.military >= 60 ? '四夷惮其威。' : ''}`;
    const close = tone === '褒' ? '《诗》云：「靡不有初，鲜克有终。」上其庶几乎！' : tone === '贬' ? '呜呼，天命靡常，惟德是辅。后之人主可不鉴哉！' : '盖棺论定，是非付之千秋。';
    return `${open}${mid}${close}`;
  }

  DS.Mock = { simulateOrder, runCouncil, dialogue, verdict, detectIntent };
})(window.DynastySim = window.DynastySim || {});

<script>
/* ============================================================================
 * ai.js — AI 调用架构
 * ----------------------------------------------------------------------------
 * · AIProvider            统一接口：async chat(messages, options) → {text, usage}
 *   ├─ MockProvider       本地 Demo 推演（路由到 DS.Mock）
 *   ├─ OpenAICompatible   POST {base}/chat/completions，解析 choices.0.message.content
 *   └─ CustomProvider     自定义方法/路径/Headers/Body 模板/响应 JSON Path
 * · AIService             中间层：Prompt 构建、上下文分层、超时、重试、
 *                         JSON 提取修复、错误分类、Token 统计、调试记录
 * 规则：游戏逻辑一律调用 DS.aiService.chat*()，禁止散落 fetch()。
 * ==========================================================================*/
(function (DS) {
  'use strict';

  /* ============================ 错误类型 ============================ */
  class AIError extends Error {
    constructor(message, opts = {}) {
      super(message);
      this.name = 'AIError';
      this.httpStatus = opts.httpStatus || 0;
      this.kind = opts.kind || 'unknown'; // network|http|timeout|parse|cancel|config
      this.suggestion = opts.suggestion || '';
      this.bodySnippet = opts.bodySnippet || '';
    }
  }

  /** HTTP 状态码 → 用户能看懂的解释与建议 */
  function describeStatus(status) {
    const M = {
      401: ['API Key 无效或未填写', '检查 API Key 是否正确、是否已过期。'],
      403: ['没有访问权限', '确认账户有该模型权限，或 Key 作用域/地域限制。'],
      404: ['接口路径或模型不存在', '检查 Base URL 是否以 /v1 等版本号结尾、模型名称是否拼写正确。'],
      429: ['请求频率过高或额度不足', '降低请求频率，或检查 API 余额/配额。'],
      500: ['服务端内部错误', '稍后重试；若持续失败，换用其他模型或服务商。'],
      502: ['网关错误', '上游服务暂不可用，请稍后重试。'],
      503: ['服务过载或维护中', '稍后重试，或更换模型。'],
    };
    return M[status] || ['服务返回错误', '查看下方响应正文了解详情。'];
  }

  /* ============================ JSON 提取与修复 ============================ */
  /** 从模型输出中尽力提取 JSON 对象；失败返回 null */
  function extractJSON(text) {
    if (!text) return null;
    let s = String(text).trim();
    // 1) 去掉 ```json ... ``` 包裹
    const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence) s = fence[1].trim();
    // 2) 直接解析
    try { return JSON.parse(s); } catch (_e) { /* 继续修复 */ }
    // 3) 截取第一个 { 到最后一个 } 之间
    const a = s.indexOf('{');
    const b = s.lastIndexOf('}');
    if (a >= 0 && b > a) {
      let core = s.slice(a, b + 1);
      try { return JSON.parse(core); } catch (_e) { /* 继续修复 */ }
      // 4) 常见问题修复：全角标点、尾逗号、智能引号（\u201C\u201D=弯双引号，\u2018\u2019=弯单引号）
      core = core
        .replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'")
        .replace(/，/g, ',').replace(/：/g, ':')
        .replace(/,\s*([}\]])/g, '$1');
      try { return JSON.parse(core); } catch (_e) { /* 放弃 */ }
    }
    return null;
  }

  /* ============================ Provider 基类 ============================ */
  class AIProvider {
    async chat(_messages, _options) { throw new Error('not implemented'); }
  }

  /* ---------------- OpenAI Compatible ---------------- */
  class OpenAICompatibleProvider extends AIProvider {
    constructor(profile) { super(); this.profile = profile || {}; }

    buildUrl() {
      const p = this.profile;
      // 代理优先（模式 B）；否则 Base URL + 路径
      const base = (p.proxyUrl || p.baseUrl || '').replace(/\/+$/, '');
      const path = p.path || '/chat/completions';
      return /^https?:\/\//i.test(path) ? path : base + path;
    }

    buildInit(messages, options) {
      const p = this.profile;
      const headers = { 'Content-Type': 'application/json' };
      if (p.apiKey) headers['Authorization'] = `Bearer ${p.apiKey}`;
      if (p.headers) for (const [k, v] of Object.entries(p.headers)) if (k && v) headers[k] = v;
      const body = {
        model: p.model || '',
        messages,
        temperature: numOr(options.temperature, numOr(p.temperature, 0.7)),
        max_tokens: numOr(options.maxTokens, numOr(p.maxTokens, 4000)),
      };
      if (p.topP != null && p.topP !== '') body.top_p = Number(p.topP);
      return { url: this.buildUrl(), init: { method: 'POST', headers, body: JSON.stringify(body) } };
    }

    /**
     * 从响应 JSON 取文本。
     * 推理模型（如 deepseek-reasoner / deepseek-v4-flash）把思考过程放在
     * `reasoning_content`、最终答案放在 `content`。当 token 预算不足时
     * `content` 可能为空而 `reasoning_content` 有内容（思考被截断）。
     * 本方法在主路径取空时自动回退到 reasoning_content，并附带诊断信息。
     * 返回 { text, finishReason, fromReasoning }
     */
    pickContentEx(data) {
      const path = this.profile.responsePath || 'choices.0.message.content';
      const val = getPath(data, path);
      const content = typeof val === 'string' ? val : (val == null ? '' : JSON.stringify(val));
      // finish_reason 可在 choices[0].finish_reason 或顶层
      const finishReason = getPath(data, 'choices.0.finish_reason') || getPath(data, 'finish_reason') || '';
      // 推理模型回退：content 为空时尝试 reasoning_content
      if (!content) {
        const rc = getPath(data, 'choices.0.message.reasoning_content')
          || getPath(data, 'reasoning_content') || '';
        if (typeof rc === 'string' && rc.trim()) {
          return { text: rc.trim(), finishReason, fromReasoning: true };
        }
      }
      return { text: content, finishReason, fromReasoning: false };
    }

    pickContent(data) {
      const path = this.profile.responsePath || 'choices.0.message.content';
      const val = getPath(data, path);
      return typeof val === 'string' ? val : (val == null ? '' : JSON.stringify(val));
    }

    async chat(messages, options) {
      const { url, init } = this.buildInit(messages, options);
      const res = await fetchWithTimeout(url, init, numOr(options.timeoutMs, 60000), options.signal);
      const data = await readJsonBody(res);
      handleHttpErrors(res.status, data);
      const { text: content, finishReason, fromReasoning } = this.pickContentEx(data);
      if (!content) {
        // 区分两种空响应，给出更精准的提示
        if (finishReason === 'length') {
          throw new AIError('模型输出被截断（token 预算耗尽）', {
            kind: 'parse',
            suggestion: `finish_reason=length 表示 max_tokens 不够。推理模型（如 deepseek-reasoner）会先在 reasoning_content 思考、再把答案写入 content；预算不足时思考刚写完答案还没生成。请在设置中调大该配置的「最大 Token」（建议 ≥4000，推演用途建议 ≥8000）。`,
            bodySnippet: DS.util.trunc(JSON.stringify(data), 400),
          });
        }
        throw new AIError('API 返回了空内容', {
          kind: 'parse',
          suggestion: `当前 Response Path 为「${this.profile.responsePath || 'choices.0.message.content'}」取到空字符串。若使用推理模型，content 为空可能因 token 不足（finish_reason=length）或模型未输出答案。请核对路径或调大 max_tokens。`,
          bodySnippet: DS.util.trunc(JSON.stringify(data), 400),
        });
      }
      // 若实际内容来自 reasoning_content（推理模型回退），记录但不阻断
      return { text: content, usage: data.usage || null, fromReasoning, finishReason };
    }
  }

  /* ---------------- Custom（自定义请求模板） ---------------- */
  class CustomProvider extends OpenAICompatibleProvider {
    buildInit(messages, options) {
      const p = this.profile;
      const base = (p.proxyUrl || p.baseUrl || '').replace(/\/+$/, '');
      const path = p.path || '/chat/completions';
      const url = /^https?:\/\//i.test(path) ? path : base + path;

      const headers = { 'Content-Type': 'application/json' };
      if (p.apiKey && !(p.headers && Object.keys(p.headers).some((k) => /authorization/i.test(k)))) {
        headers['Authorization'] = `Bearer ${p.apiKey}`;
      }
      if (p.headers) for (const [k, v] of Object.entries(p.headers)) if (k && v) headers[k] = v;

      const system = messages.find((m) => m.role === 'system');
      const userParts = messages.filter((m) => m.role !== 'system');
      const tpl = p.bodyTemplate && p.bodyTemplate.trim()
        ? p.bodyTemplate
        : JSON.stringify({ model: '{{model}}', messages: '{{messages_json}}', temperature: '{{temperature}}', max_tokens: '{{max_tokens}}' });
      const filled = tpl
        .replaceAll('{{model}}', p.model || '')
        .replaceAll('{{messages_json}}', JSON.stringify(messages))
        .replaceAll('{{system}}', system ? system.content : '')
        .replaceAll('{{user}}', userParts.map((m) => m.content).join('\n\n'))
        .replaceAll('{{temperature}}', String(numOr(options.temperature, numOr(p.temperature, 0.7))))
        .replaceAll('{{max_tokens}}', String(numOr(options.maxTokens, numOr(p.maxTokens, 4000))));
      let bodyStr = filled;
      try { bodyStr = JSON.stringify(JSON.parse(filled)); } catch (_e) { /* 模板非合法 JSON 时原样发送 */ }

      return { url, init: { method: p.method || 'POST', headers, body: bodyStr } };
    }
  }

  /* ---------------- Mock ---------------- */
  class MockProvider extends AIProvider {
    async chat(_messages, options) {
      // 模拟网络延迟，让 Loading 动画有意义（300~900ms）
      await new Promise((r) => setTimeout(r, 300 + Math.random() * 600));
      const state = options.mockState;
      const kind = options.mockKind;
      if (!state) throw new AIError('Demo 模式缺少世界状态', { kind: 'config' });
      if (kind === 'order') {
        return { text: JSON.stringify(DS.Mock.simulateOrder(state, options.mockPayload.text)), usage: null };
      }
      if (kind === 'council') {
        return { text: JSON.stringify(DS.Mock.runCouncil(state, options.mockPayload.charIds)), usage: null };
      }
      if (kind === 'dialogue') {
        return { text: JSON.stringify(DS.Mock.dialogue(state, options.mockPayload.charId, options.mockPayload.message)), usage: null };
      }
      if (kind === 'verdict') {
        return { text: DS.Mock.verdict(state, options.mockPayload.ending), usage: null };
      }
      if (kind === 'test') {
        return { text: 'API连接成功（本地 Demo 推演模式）', usage: null };
      }
      throw new AIError(`未知的 Demo 推演类型 ${kind}`, { kind: 'config' });
    }
  }

  /* ============================ 底层工具 ============================ */
  function numOr(v, dflt) { const n = Number(v); return isFinite(n) ? n : dflt; }

  /** 点路径取值：choices.0.message.content */
  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }

  /** 带超时与外部取消的 fetch */
  async function fetchWithTimeout(url, init, timeoutMs, externalSignal) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(new DOMException('timeout', 'TimeoutError')), timeoutMs);
    const onExternalAbort = () => ctrl.abort(new DOMException('cancelled', 'AbortError'));
    if (externalSignal) {
      if (externalSignal.aborted) onExternalAbort();
      else externalSignal.addEventListener('abort', onExternalAbort, { once: true });
    }
    try {
      return await fetch(url, { ...init, signal: ctrl.signal });
    } catch (err) {
      if (err && err.name === 'TimeoutError') {
        throw new AIError(`请求超时（${timeoutMs} ms）`, { kind: 'timeout', suggestion: '可在设置的 Token 控制中调大超时时间，或更换更快的模型。' });
      }
      if (err && err.name === 'AbortError') {
        throw new AIError('请求已取消', { kind: 'cancel', suggestion: '' });
      }
      throw new AIError(`网络请求失败：${err && err.message ? err.message : err}`, {
        kind: 'network',
        suggestion: '可能原因：断网、Base URL 错误，或该 API 不允许浏览器跨域（CORS）。请使用支持 CORS 的 API，或在「代理 URL」中填写你自己的后端代理。',
      });
    } finally {
      clearTimeout(timer);
      if (externalSignal) externalSignal.removeEventListener('abort', onExternalAbort);
    }
  }

  async function readJsonBody(res) {
    const raw = await res.text().catch(() => '');
    try { return raw ? JSON.parse(raw) : {}; }
    catch (_e) {
      const e = new AIError('API 返回的不是 JSON', {
        kind: 'parse', httpStatus: res.status,
        bodySnippet: DS.util.trunc(raw, 400),
        suggestion: '确认 Base URL/路径指向的是 Chat Completions 接口，而不是网页。',
      });
      throw e;
    }
  }

  function handleHttpErrors(status, data) {
    if (status >= 200 && status < 300) return;
    const [reason, advice] = describeStatus(status);
    const msg = data && data.error && data.error.message ? String(data.error.message) : reason;
    throw new AIError(`HTTP ${status}：${msg}`, {
      kind: 'http', httpStatus: status,
      suggestion: `${reason}。建议：${advice}`,
      bodySnippet: DS.util.trunc(JSON.stringify(data), 400),
    });
  }

  /* ============================ Prompt Builder（上下文分层） ============================ */
  const PB = {

    /** Layer1 世界基础 + Layer2 当前回合 */
    worldCore(state) {
      const C = state.country;
      const diff = DS.DATA.DIFFICULTIES.find((d) => d.id === state.difficulty) || {};
      return [
        `【L1 世界基础】王朝：${state.dynasty.countryName}｜年号${state.ruler.eraName}｜皇帝${state.ruler.name}｜难度：${diff.label || state.difficulty}(惯性${diff.inertia})`,
        `皇权 ${Math.round(state.ruler.authority)}｜正统 ${state.ruler.legitimacy}`,
        `国库 ${Math.round(C.treasury)}两｜国债 ${Math.round(C.debt)}｜粮食 ${Math.round(C.food)}石｜人口 ${C.population}`,
        `民心 ${Math.round(C.publicSupport)}｜稳定 ${Math.round(C.stability)}｜腐败 ${Math.round(C.corruption)}｜官僚 ${Math.round(C.bureaucracy)}｜军力 ${Math.round(C.militaryPower)}｜士气 ${Math.round(C.morale)}｜边压 ${Math.round(C.borderPressure)}`,
        `已推行国策：${(state.activePolicies || []).map((id) => (state.policiesKnown.find((p) => p.id === id) || {}).name).filter(Boolean).join('、') || '无'}`,
        `【L2 当前回合】第 ${state.turn} 回合｜${DS.util.dateLabel(state.date)}（${DS.util.seasonOf(state.date.month)}季）`,
        `各地灾情：${state.regions.filter((r) => r.disaster).map((r) => `${r.name}${r.disaster.type}${DS.DATA.SEVERITY_LABELS[r.disaster.severity]}`).join('、') || '无'}`,
        `待触发隐患：${(state.pendingEvents || []).map((p) => `${p.title}(第${p.dueTurn}回合)`).join('、') || '无'}`,
      ].join('\n');
    },

    /** Layer3 近期事件 + Layer5 长期记忆 */
    memoryBlock(state) {
      const recent = (state.events || []).slice(0, 6)
        .map((e) => `- [${e.date}/${e.severity}] ${e.title}：${DS.util.trunc(e.description, 60)}`).join('\n');
      const mem = (state.longTermMemory || []).slice(0, 8).map((m) => `- ${m}`).join('\n');
      return `【L3 近期事件】\n${recent || '（无）'}\n【L5 长期记忆】\n${mem || '（无）'}`;
    },

    /** Layer4 重要人物 */
    npcBlock(state) {
      const chars = [...(state.characters || [])]
        .sort((a, b) => b.ability * b.ambition - a.ability * a.ambition).slice(0, 8);
      const lines = chars.map((c) =>
        `- ${c.id} ${c.name}（${c.role}，${c.faction}）忠${Math.round(c.loyalty)} 能${c.ability} 贪${c.corruption} 信${Math.round(c.trust)}｜性格:${c.personality.join('/')}｜近况:${c.task}`);
      const regions = state.regions.map((r) =>
        `- ${r.id} ${r.name}：民${Math.round(r.loyalty)} 乱险${Math.round(r.unrest)} 税率${r.taxRate}% 粮${DS.util.fmtRes(r.grain, '石')} 治安${Math.round(r.security)}${r.disaster ? `（${r.disaster.type}${r.disaster.severity}级）` : ''}`);
      const diplo = (state.diplomacy || []).map((d) =>
        `- ${d.id} ${d.name}（${d.type}）：关系${d.relation} 边压${d.borderPressure} 威胁${d.threat} 贸易${d.trade}`);
      return `【L4 重要人物】\n${lines.join('\n')}\n【地区速览】\n${regions.join('\n')}\n【外交】\n${diplo.join('\n')}`;
    },

    /** 完整推演 Prompt：Layer6 玩家命令收尾 */
    simulation(state, orderText) {
      const prompts = getPrompts();
      const system = prompts.system + '\n\n' + prompts.worldview + '\n\n' + prompts.event + '\n\n' + prompts.simulation;
      const user = [
        PB.worldCore(state),
        PB.memoryBlock(state),
        PB.npcBlock(state),
        state.intro ? `【剧本背景】\n${DS.util.trunc(state.intro, 300)}` : '',
        `【L6 皇帝政令】\n"""${orderText}"""`,
        '请按系统提示中的 JSON 结构输出本回合推演结果，只输出 JSON。',
      ].filter(Boolean).join('\n\n');
      return { system, user };
    },

    council(state, charIds) {
      const prompts = getPrompts();
      const chars = charIds.map((id) => DS.State.getCharacter(state, id)).filter(Boolean);
      const persona = chars.map((c) =>
        `- ${c.id} ${c.name}｜${c.role}｜派系:${c.faction}｜忠诚${Math.round(c.loyalty)}｜能力${c.ability}｜性格:${c.personality.join('/')}${c.secrets.length && (state.flags.revealedSecrets || []).includes(c.id) ? '｜(皇帝已知其秘密:' + c.secrets[0] + ')' : ''}`).join('\n');
      const system = prompts.system + '\n\n【廷议任务】\n诸位大臣奉召廷议。为每位大臣生成一段发言：\n- 发言必须体现其职位关注点、性格与派系利益，绝不允许两人说同样的话。\n- 可引用上方具体数值佐证观点；可互相呼应或反驳（在 content 中点名对方）。\n- support 字段：support=赞同现状方向 / cautious=有保留 / oppose=反对。\n- 只输出 JSON：{"speeches":[{"characterId":"ID","stance":"二字态度","support":"support|cautious|oppose","content":"80~160字发言"}],"consensus":"四字概括","advice_summary":"一句话归纳分歧"}';
      const user = [
        PB.worldCore(state),
        PB.memoryBlock(state),
        `【参会大臣】\n${persona}`,
        '请生成廷议发言 JSON。',
      ].join('\n\n');
      return { system, user };
    },

    dialogue(state, charId, message, history) {
      const prompts = getPrompts();
      const c = DS.State.getCharacter(state, charId);
      const relations = Object.entries(c.relationships || {}).map(([oid, r]) => {
        const o = DS.State.getCharacter(state, oid);
        return o ? `${o.name}(${r.type})` : null;
      }).filter(Boolean).join('、');
      // 秘密保护：只有 flags.revealedSecrets 里的人物才把秘密给模型
      const secretNote = c.secrets.length
        ? ((state.flags.revealedSecrets || []).includes(c.id)
          ? `(该秘密已被皇帝察觉，可坦然谈及:${c.secrets.join('；')})`
          : '(以下秘密绝对不能在对话中提及或暗示:' + c.secrets.join('；') + ')')
        : '';
      const system = prompts.system + '\n\n' + prompts.npc +
        `\n\n【你所扮演的角色】\n${c.name}，${c.role}，${c.faction}，年龄${c.age}。性格：${c.personality.join('/')}。忠诚${Math.round(c.loyalty)}，能力${c.ability}，野心${c.ambition}，贪腐${c.corruption}。当前事务：${c.task}。${relations ? '人物关系：' + relations + '。' : ''}${secretNote}`;
      const user = [
        PB.worldCore(state),
        `【近期大事】\n${(state.events || []).slice(0, 3).map((e) => `- ${e.title}`).join('\n') || '（无）'}`,
        history && history.length ? `【此前君臣对话摘要】\n${history.slice(-3).join('\n')}` : '',
        `【陛下问】\n"""${message}"""`,
        '只输出 JSON：{"reply":"...","attitude":"...","trust_delta":整数}',
      ].filter(Boolean).join('\n\n');
      return { system, user };
    },

    summary(state, ending) {
      const prompts = getPrompts();
      const system = prompts.summary;
      const bigEvents = (state.history || []).slice(0, 20).map((h) => `[${h.date}] ${h.title}`).join('\n');
      const user = [
        PB.worldCore(state),
        `结局：${ending.label}——${ending.desc}`,
        `评分：经济${scoresOf(ending, 'economy')} 民生${scoresOf(ending, 'livelihood')} 军事${scoresOf(ending, 'military')} 政治${scoresOf(ending, 'political')} 外交${scoresOf(ending, 'diplomatic')} 改革${scoresOf(ending, 'reform')} 稳定${scoresOf(ending, 'stabilityScore')}`,
        `在位 ${ending.stats.reignYears} 年（${ending.stats.turns} 回合），下诏 ${ending.stats.orders} 道，推行国策 ${ending.stats.policies} 项。`,
        `【大事记节选】\n${bigEvents}`,
        '请撰写史官评语。',
      ].join('\n');
      return { system, user };
    },
  };
  function scoresOf(e, k) { return e.scores && e.scores[k] != null ? Math.round(e.scores[k]) : '—'; }
  function getPrompts() {
    const s = DS.Storage ? DS.Storage.loadSettings() : null;
    return (s && s.prompts) || DS.DATA.DEFAULT_PROMPTS;
  }

  /* ============================ AIService ============================ */
  class AIService {
    constructor() {
      this.debug = { lastPrompt: null, lastResponse: null, latencyMs: 0, usage: null, parseStatus: '', requestUrl: '' };
    }

    settings() { return DS.Storage.loadSettings(); }

    /** 按用途解析 Profile；找不到或显式为 mock 时返回 MockProvider */
    providerFor(purpose) {
      const st = this.settings();
      const pid = st.api.purposes[purpose];
      const prof = (st.api.profiles || []).find((p) => p.id === pid);
      if (!prof || prof.kind === 'mock') return new MockProvider();
      if (prof.kind === 'custom') return new CustomProvider(prof);
      return new OpenAICompatibleProvider(prof);
    }

    isActiveMock(purpose) {
      const st = this.settings();
      const pid = st.api.purposes[purpose];
      const prof = (st.api.profiles || []).find((p) => p.id === pid);
      return !prof || prof.kind === 'mock';
    }

    /** 文本对话（NPC 台词等需要 JSON 的场景请用 chatJSON） */
    async chatRaw(purpose, system, user, opts = {}) {
      const st = this.settings();
      const prof = (st.api.profiles || []).find((p) => p.id === st.api.purposes[purpose]);
      const provider = this.providerFor(purpose);
      const messages = [{ role: 'system', content: system }, { role: 'user', content: user }];
      const options = {
        temperature: opts.temperature ?? prof?.temperature,
        maxTokens: opts.maxTokens ?? prof?.maxTokens,
        timeoutMs: opts.timeoutMs ?? prof?.timeoutMs ?? st.ai.timeoutMs,
        signal: opts.signal,
        mockKind: opts.mockKind, mockState: opts.mockState, mockPayload: opts.mockPayload,
      };
      this.debug.lastPrompt = { purpose, system, user, at: DS.util.nowISO() };
      const t0 = performance.now();
      const out = await provider.chat(messages, options);
      this.debug.latencyMs = Math.round(performance.now() - t0);
      this.debug.usage = out.usage;
      this.debug.lastResponse = DS.util.maskSecret(out.text, prof && prof.apiKey);
      this.debug.requestUrl = provider.buildUrl ? provider.buildUrl() : '(mock)';
      return out;
    }

    /**
     * 要求模型返回 JSON 并解析；失败自动重试一次（附修复指令）。
     * @returns {object} 解析后的对象
     * @throws AIError
     */
    async chatJSON(purpose, system, user, opts = {}) {
      let lastErr = null;
      for (let attempt = 0; attempt <= 1; attempt++) {
        const retryNote = attempt === 0 ? '' :
          '\n\n【重要】上一次输出不是合法 JSON。请重新输出，且只输出一个合法 JSON 对象：不要 Markdown 代码块、不要解释文字、不要尾逗号。';
        const out = await this.chatRaw(purpose, system, user + retryNote, opts);
        const parsed = extractJSON(out.text);
        if (parsed) {
          this.debug.parseStatus = attempt === 0 ? '直接解析成功' : '重试后解析成功';
          return parsed;
        }
        // 推理模型回退场景：content 为空、reasoning_content 有思考但非 JSON 答案
        const reasoningHint = out.fromReasoning
          ? '本次内容来自 reasoning_content（推理模型的思考过程），content 为空说明 token 预算不足、模型还没来得及输出正式 JSON 答案就被截断。请在设置中大幅调大该配置的「最大 Token」（推演建议 ≥8000），或改用非推理模型（如 deepseek-chat）。'
          : '模型返回的内容不含合法 JSON。可尝试：换用指令遵循更好的模型、调低 Temperature，或在设置中修改推演 Prompt。';
        lastErr = new AIError('AI 返回的内容无法解析为 JSON', {
          kind: 'parse',
          suggestion: '已在后台自动重试仍失败。' + reasoningHint,
          bodySnippet: DS.util.trunc(out.text, 400),
        });
        this.debug.parseStatus = attempt === 0 ? '首次解析失败，重试中…' : '解析失败';
      }
      throw lastErr;
    }

    /** 测试某个 Profile 连通性 */
    async testProfile(profileId) {
      const t0 = performance.now();
      const st = this.settings();
      const idx = (st.api.profiles || []).findIndex((p) => p.id === profileId);
      if (idx < 0) throw new AIError('配置不存在', { kind: 'config' });
      const prof = st.api.profiles[idx];
      const provider = prof.kind === 'custom' ? new CustomProvider(prof) : prof.kind === 'mock' ? new MockProvider() : new OpenAICompatibleProvider(prof);
      if (prof.kind === 'mock') {
        const out = await provider.chat([{ role: 'user', content: '你好' }], { mockKind: 'test' });
        return { ok: true, model: '本地 Demo 引擎', reply: out.text, latencyMs: Math.round(performance.now() - t0) };
      }
      const messages = [{ role: 'user', content: '你好，请返回“API连接成功”。' }];
      // 推理模型（reasoning）需要思考空间，20 token 远不够；给充足预算并放宽成功判定
      const out = await provider.chat(messages, { maxTokens: 1024, temperature: 0, timeoutMs: prof.timeoutMs || st.ai.timeoutMs });
      const ok = !!out.text;
      const note = out.fromReasoning ? '（内容来自 reasoning_content 回退：content 为空，可能是推理模型思考阶段，连接已通）' : '';
      return { ok, model: prof.model, reply: DS.util.trunc((out.text || '(空)') + note, 200), latencyMs: Math.round(performance.now() - t0), usage: out.usage };
    }
  }

  DS.AI = { AIError, extractJSON, OpenAICompatibleProvider, CustomProvider, MockProvider, PromptBuilder: PB, describeStatus };
  DS.aiService = new AIService();
})(window.DynastySim = window.DynastySim || {});

</script>
<script>
/* ============================================================================
 * storage.js — 数据持久化
 * ----------------------------------------------------------------------------
 * · Settings：localStorage「dynasty_settings_v1」（API Profile、Prompt、推演参数…）
 * · Saves：每槽一个 key「dynasty_save_<slot>」，含 checksum 完整性校验与版本迁移
 * · Scenarios：本地剧本库「dynasty_scenarios_v1」
 * 安全：API Key 仅保存在本机 localStorage；导出配置时默认剥离 Key。
 * ==========================================================================*/
(function (DS) {
  'use strict';

  const LS_SETTINGS = 'dynasty_settings_v1';
  const LS_SCENARIOS = 'dynasty_scenarios_v1';
  const SAVE_PREFIX = 'dynasty_save_';
  const SLOTS = ['auto', 'slot1', 'slot2', 'slot3', 'slot4', 'slot5'];

  /* ---------------- 默认设置 ---------------- */
  function defaultSettings() {
    return {
      schemaVersion: 1,
      lang: 'zh-CN',
      theme: 'classic',          // classic | dark | light
      reduceMotion: false,
      autosave: true,
      debugMode: false,
      difficulty: 'standard',
      simulation: {              // 推演参数（0~1）
        inertia: 0.6,            // 历史惯性
        randomness: 0.5,         // 随机性
        npcIndependence: 0.6,    // NPC 独立性
        eventDensity: 0.5,       // 事件密度
        longTermImpact: 0.6,     // 长期后果强度
      },
      ai: {
        timeoutMs: 60000,
        maxRetries: 1,
        quickMode: 'standard',   // fast | standard | quality （仅影响默认 maxTokens 建议）
      },
      api: {
        profiles: [
          { id: 'mock_local', name: '本地 Demo 引擎（无需 API）', kind: 'mock' },
        ],
        purposes: {              // 用途 → profileId（多模型分别配置）
          simulation: 'mock_local',
          dialogue: 'mock_local',
          summary: 'mock_local',
        },
      },
      prompts: DS.util.deepClone(DS.DATA.DEFAULT_PROMPTS),
    };
  }

  let settingsCache = null;

  function loadSettings() {
    if (settingsCache) return settingsCache;
    try {
      const raw = localStorage.getItem(LS_SETTINGS);
      settingsCache = raw ? migrateSettings(JSON.parse(raw)) : defaultSettings();
    } catch (_e) {
      settingsCache = defaultSettings();
    }
    return settingsCache;
  }

  function saveSettings(next) {
    settingsCache = next || settingsCache || defaultSettings();
    try {
      localStorage.setItem(LS_SETTINGS, JSON.stringify(settingsCache));
      return true;
    } catch (e) {
      console.warn('设置保存失败（可能存储已满）', e);
      return false;
    }
  }

  function resetSettings() {
    settingsCache = defaultSettings();
    saveSettings();
    return settingsCache;
  }

  function migrateSettings(raw) {
    const def = defaultSettings();
    const merged = deepMerge(def, raw);
    merged.schemaVersion = def.schemaVersion;
    // 保证 mock profile 永远存在
    if (!merged.api.profiles.some((p) => p.id === 'mock_local')) {
      merged.api.profiles.unshift({ id: 'mock_local', name: '本地 Demo 引擎（无需 API）', kind: 'mock' });
    }
    for (const k of Object.keys(merged.api.purposes)) {
      if (!merged.api.profiles.some((p) => p.id === merged.api.purposes[k])) {
        merged.api.purposes[k] = 'mock_local';
      }
    }
    return merged;
  }

  function deepMerge(target, src) {
    for (const [k, v] of Object.entries(src || {})) {
      if (v && typeof v === 'object' && !Array.isArray(v)) {
        target[k] = target[k] && typeof target[k] === 'object' ? target[k] : {};
        deepMerge(target[k], v);
      } else if (v !== undefined) target[k] = v;
    }
    return target;
  }

  /* ---------------- 存档 ---------------- */
  function saveKey(slot) { return SAVE_PREFIX + slot; }

  /**
   * @returns {{ok:boolean, error?:string}} 
   */
  function writeSave(slot, state, label) {
    try {
      const payload = {
        kind: 'dynasty-save',
        version: DS.State.SCHEMA_VERSION,
        timestamp: DS.util.nowISO(),
        slot,
        label: label || '',
        meta: {
          dynasty: state.dynasty.name,
          ruler: state.ruler.name,
          date: DS.util.dateLabel(state.date),
          turn: state.turn,
        },
        gameState: state,
      };
      payload.checksum = DS.util.checksum(JSON.stringify(payload.gameState));
      localStorage.setItem(saveKey(slot), JSON.stringify(payload));
      return { ok: true };
    } catch (e) {
      return { ok: false, error: '存档写入失败：' + (e && e.message ? e.message : '存储空间不足') };
    }
  }

  function readSave(slot) {
    try {
      const raw = localStorage.getItem(saveKey(slot));
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.kind !== 'dynasty-save' || !data.gameState) {
        return { corrupt: true, error: '存档结构不合法' };
      }
      const sum = DS.util.checksum(JSON.stringify(data.gameState));
      const mismatch = data.checksum && sum !== data.checksum;
      const state = DS.State.normalizeState(data.gameState);
      return { data, state, checksumMismatch: !!mismatch };
    } catch (e) {
      return { corrupt: true, error: '存档解析失败：' + (e && e.message ? e.message : '') };
    }
  }

  function deleteSave(slot) { localStorage.removeItem(saveKey(slot)); }

  function listSaves() {
    return SLOTS.map((slot) => {
      const r = readSave(slot);
      if (!r) return { slot, empty: true };
      if (r.corrupt) return { slot, empty: false, corrupt: true, error: r.error };
      return {
        slot, empty: false, corrupt: false,
        checksumMismatch: r.checksumMismatch,
        timestamp: r.data.timestamp,
        label: r.data.label,
        meta: r.data.meta || {},
      };
    });
  }

  /** 导出：dynasty-save-YYYY-MM-DD.json */
  function exportSave(slot) {
    const r = readSave(slot);
    if (!r || r.corrupt) throw new Error('该存档不存在或已损坏');
    DS.util.download(`dynasty-save-${DS.util.todayStamp()}.json`, JSON.stringify(r.data, null, 2));
  }

  /** 导入：验证 kind/version/checksum 后写入第一个空槽（或指定槽） */
  function importSave(text, slot) {
    let data;
    try { data = JSON.parse(text); } catch (_e) { throw new Error('文件不是合法 JSON'); }
    if (!data || data.kind !== 'dynasty-save') throw new Error('这不是王朝模拟器存档文件（缺少 kind 标识）');
    if (!data.gameState || typeof data.gameState !== 'object') throw new Error('存档缺少 gameState');
    if (data.version > DS.State.SCHEMA_VERSION) throw new Error(`存档版本(${data.version})高于当前支持的版本(${DS.State.SCHEMA_VERSION})，请升级游戏`);
    const sum = DS.util.checksum(JSON.stringify(data.gameState));
    const mismatch = data.checksum && sum !== data.checksum;
    const target = slot || firstEmptySlot() || 'slot5';
    const wr = writeSave(target, DS.State.normalizeState(data.gameState), data.label || '导入存档');
    if (!wr.ok) throw new Error(wr.error);
    return { slot: target, checksumMismatch: !!mismatch };
  }

  function firstEmptySlot() {
    for (const s of SLOTS) if (s !== 'auto' && !localStorage.getItem(saveKey(s))) return s;
    return null;
  }

  /* ---------------- 本地剧本库 ---------------- */
  function listScenarios() {
    try { return JSON.parse(localStorage.getItem(LS_SCENARIOS) || '[]'); }
    catch (_e) { return []; }
  }
  function saveScenarios(list) {
    localStorage.setItem(LS_SCENARIOS, JSON.stringify(list.slice(0, 30)));
  }
  function upsertScenario(sc) {
    const list = listScenarios();
    sc.id = sc.id || ('sc_u_' + DS.util.uid('').slice(2));
    const i = list.findIndex((x) => x.id === sc.id);
    if (i >= 0) list[i] = sc; else list.push(sc);
    saveScenarios(list);
    return sc;
  }
  function deleteScenario(id) {
    saveScenarios(listScenarios().filter((x) => x.id !== id));
  }
  function importScenario(text) {
    const sc = JSON.parse(text);
    if (!sc || !sc.name) throw new Error('剧本缺少 name 字段');
    sc.builtin = false;
    return upsertScenario(sc);
  }
  function exportScenario(sc) {
    DS.util.download('scenario.json', JSON.stringify(sc, null, 2));
  }

  /* ---------------- 清空 ---------------- */
  function clearAll() {
    for (const s of SLOTS) deleteSave(s);
    localStorage.removeItem(LS_SETTINGS);
    localStorage.removeItem(LS_SCENARIOS);
    settingsCache = null;
  }

  DS.Storage = {
    defaultSettings, loadSettings, saveSettings, resetSettings,
    SLOTS, listSaves, readSave, writeSave, deleteSave, exportSave, importSave,
    listScenarios, upsertScenario, deleteScenario, importScenario, exportScenario,
    clearAll,
  };
})(window.DynastySim = window.DynastySim || {});

</script>
<script>
/* ============================================================================
 * map.js — 天下地图（原创抽象 SVG 地图）
 * ----------------------------------------------------------------------------
 * · 8 个地区以不规则多边形呈现（由包围盒+确定性抖动生成，风格化不写实）
 * · 图层：标准 / 民心 / 财政 / 粮食 / 灾害 / 动乱 / 军事 / 治安
 * · 灾害用抽象符号（日纹、波纹、蝗点、疫符、饥纹），不含任何不适画面
 * · 不做逐帧重绘：仅图层切换或状态变化时重建
 * ==========================================================================*/
(function (DS) {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const LAYERS = [
    { id: 'standard', label: '标准' },
    { id: 'publicSupport', label: '民心' },
    { id: 'income', label: '财政' },
    { id: 'grain', label: '粮食' },
    { id: 'disaster', label: '灾害' },
    { id: 'unrest', label: '动乱' },
    { id: 'military', label: '军事' },
    { id: 'security', label: '治安' },
  ];

  /** 由包围盒生成不规则六边形顶点（抖动量由地区 id 确定，稳定可复现） */
  function polyPoints(r) {
    const h = DS.util.hash32('geo' + r.id);
    const j = (i, amp) => ((h >> (i * 3)) % 7 - 3) / 3 * amp;
    const x = r.x, y = r.y, w = r.w, hh = r.h;
    const pts = [
      [x + w * 0.12, y + j(1, 10)],            // 左上
      [x + w * 0.55, y + Math.max(4, 8 + j(2, 8))],   // 上中
      [x + w * 0.94, y + j(3, 10)],            // 右上
      [x + w * 0.9, y + hh * 0.62],            // 右中偏下
      [x + w * 0.5, y + hh - Math.max(4, 6 + j(4, 8))], // 下中
      [x + w * 0.08, y + hh * 0.7],            // 左下
    ];
    return pts.map((p) => p.map((n) => Math.round(n)).join(',')).join(' ');
  }

  /** 数值 → 颜色（0..100）。goodDir=true 时值越大越青绿，越小越赤红 */
  function valueColor(v, goodDir) {
    const t = DS.util.clamp(v / 100, 0, 1);
    // 红(#c0392b) → 土黄(#d9b44a) → 青绿(#4e8d6e)
    const stops = [[192, 57, 43], [217, 180, 74], [78, 141, 110]];
    const pos = goodDir ? t : 1 - t;
    const seg = pos < 0.5 ? 0 : 1;
    const localT = pos < 0.5 ? pos / 0.5 : (pos - 0.5) / 0.5;
    const c0 = stops[seg], c1 = stops[seg + 1];
    const mix = c0.map((c, i) => Math.round(c + (c1[i] - c[i]) * localT));
    return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
  }

  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, String(v));
    return n;
  }

  /* ---------------- 灾害抽象符号 ---------------- */
  function drawDisasterGlyph(g, cx, cy, type, severity) {
    const col = { '旱灾': '#e67e22', '洪灾': '#2980b9', '蝗灾': '#8e6e1f', '疫情': '#8e44ad', '饥荒': '#7f8c8d' }[type] || '#999';
    if (type === '旱灾') {
      g.append(svgEl('circle', { cx, cy, r: 7, fill: 'none', stroke: col, 'stroke-width': 2 }));
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 * i) / 8;
        g.append(svgEl('line', {
          x1: cx + Math.cos(a) * 9.5, y1: cy + Math.sin(a) * 9.5,
          x2: cx + Math.cos(a) * 13, y2: cy + Math.sin(a) * 13,
          stroke: col, 'stroke-width': 2,
        }));
      }
    } else if (type === '洪灾') {
      for (let i = -1; i <= 1; i++) {
        g.append(svgEl('path', {
          d: `M ${cx - 12} ${cy + i * 6} q 4 -5 8 0 t 8 0 t 8 0`,
          fill: 'none', stroke: col, 'stroke-width': 2,
        }));
      }
    } else if (type === '蝗灾') {
      const dots = [[0, -6], [-7, 5], [7, 5]];
      for (const [dx, dy] of dots) g.append(svgEl('circle', { cx: cx + dx, cy: cy + dy, r: 3.2, fill: col }));
    } else if (type === '疫情') {
      g.append(svgEl('rect', { x: cx - 3, y: cy - 9, width: 6, height: 18, fill: col, rx: 2 }));
      g.append(svgEl('rect', { x: cx - 9, y: cy - 3, width: 18, height: 6, fill: col, rx: 2 }));
    } else { // 饥荒：空碗弧线
      g.append(svgEl('path', { d: `M ${cx - 10} ${cy} a 10 10 0 0 0 20 0 z`, fill: 'none', stroke: col, 'stroke-width': 2.5 }));
      g.append(svgEl('line', { x1: cx - 13, y1: cy, x2: cx + 13, y2: cy, stroke: col, 'stroke-width': 2.5 }));
    }
    // 强度刻度（一~五 用短竖线表示）
    for (let i = 0; i < severity; i++) {
      g.append(svgEl('rect', { x: cx - 8 + i * 5, y: cy + 14, width: 3, height: 5, fill: col, rx: 1 }));
    }
  }

  /* ---------------- 主渲染 ---------------- */
  /**
   * @param {HTMLElement} container
   * @param {object} state 游戏状态
   * @param {string} layer 图层 id
   * @param {(regionId:string)=>void} onRegionClick
   */
  function render(container, state, layer, onRegionClick) {
    container.textContent = '';
    const svg = svgEl('svg', {
      viewBox: '0 0 1000 720',
      class: 'map-svg',
      role: 'img',
      'aria-label': '天下地图：' + (LAYERS.find((l) => l.id === layer) || {}).label,
      preserveAspectRatio: 'xMidYMid meet',
    });

    // 海洋底色 + 装饰性「海岸线」
    svg.append(svgEl('rect', { x: 0, y: 0, width: 1000, height: 720, class: 'map-sea' }));
    svg.append(svgEl('path', {
      d: 'M 60 40 C 200 120, 160 260, 80 340 M 950 90 C 900 200, 960 300, 900 380',
      class: 'map-wave-deco', fill: 'none',
    }));

    for (const r of state.regions) {
      const g = svgEl('g', {
        class: 'map-region' + (r.disaster ? ' has-disaster' : ''),
        role: 'button', tabindex: '0',
        'aria-label': `${r.name}，点击查看详情`,
      });
      const pts = polyPoints(r);

      // 填充色取决于图层
      let fill = 'var(--map-land)';
      let badge = '';
      switch (layer) {
        case 'publicSupport': fill = valueColor(r.loyalty, true); break;
        case 'unrest': fill = valueColor(r.unrest, false); break;
        case 'security': fill = valueColor(r.security, true); break;
        case 'military': fill = valueColor(r.military, true); break;
        case 'grain': fill = valueColor(DS.util.clamp((r.grain / Math.max(1, r.population)) * 400, 0, 100), true); break;
        case 'income': fill = valueColor(DS.util.clamp((r.income / 170000) * 100, 0, 100), true); break;
        case 'disaster': fill = r.disaster ? valueColor(r.disaster.severity * 20, false) : 'var(--map-land-calm)'; break;
        default: fill = r.disaster ? 'var(--map-land)' : 'var(--map-land-calm)';
      }

      g.append(svgEl('polygon', {
        points: pts, fill, class: 'map-poly',
        stroke: 'rgba(0,0,0,.35)', 'stroke-width': 2,
      }));

      // 名称与主数值标签
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      const label = svgEl('text', { x: cx, y: cy - 6, class: 'map-label', 'text-anchor': 'middle' });
      label.textContent = r.name;
      g.append(label);

      const valText = {
        standard: r.unrest >= 60 ? '乱' : '安',
        publicSupport: `民 ${Math.round(r.loyalty)}`,
        income: `${DS.util.fmtRes(r.income)}两/月`,
        grain: `粮 ${DS.util.fmtRes(r.grain, '石')}`,
        disaster: r.disaster ? `${r.disaster.type}` : '无灾',
        unrest: `乱 ${Math.round(r.unrest)}`,
        military: `军 ${Math.round(r.military)}`,
        security: `治 ${Math.round(r.security)}`,
      }[layer] || '';
      const sub = svgEl('text', { x: cx, y: cy + 16, class: 'map-sublabel', 'text-anchor': 'middle' });
      sub.textContent = valText;
      g.append(sub);

      // 灾害符号
      if (r.disaster && (layer === 'standard' || layer === 'disaster')) {
        drawDisasterGlyph(g, r.x + r.w - 26, r.y + 26, r.disaster.type, r.disaster.severity);
      }

      // 交互
      const activate = () => onRegionClick && onRegionClick(r.id);
      g.addEventListener('click', activate);
      g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); activate(); } });
      svg.append(g);
    }

    // 指北针装饰
    const compass = svgEl('g', { class: 'map-compass' });
    compass.append(svgEl('circle', { cx: 52, cy: 668, r: 18, class: 'compass-ring' }));
    compass.append(svgEl('path', { d: 'M 52 652 L 58 672 L 52 667 L 46 672 Z', class: 'compass-needle' }));
    const north = svgEl('text', { x: 52, y: 700, 'text-anchor': 'middle', class: 'compass-label' });
    north.textContent = '北';
    compass.append(north);
    svg.append(compass);

    container.append(svg);
  }

  DS.MapView = { render, LAYERS };
})(window.DynastySim = window.DynastySim || {});

</script>
<script>
/* ============================================================================
 * ui.js — UI 框架层
 * ----------------------------------------------------------------------------
 * · TopBar（8 项国家指标：当前值/趋势/tooltip/最近变化原因）
 * · SideNav / MobileNav / Drawer、视图切换
 * · Modal / Confirm / Toast / LoadingOverlay（示意步骤动画，明确标注）
 * · 圣旨输入区（多行自适应高度、Ctrl+Enter 提交、防重复提交）
 * 所有渲染基于中央 State；文本一律经 el() 文本节点插入，天然防 XSS。
 * ==========================================================================*/
(function (DS) {
  'use strict';
  const { el, qs } = DS.util;

  const NAV_ITEMS = [
    { id: 'world', icon: '🗺️', key: 'nav_world' },
    { id: 'court', icon: '🏯', key: 'nav_court' },
    { id: 'characters', icon: '👥', key: 'nav_chars' },
    { id: 'policies', icon: '📜', key: 'nav_policy' },
    { id: 'events', icon: '⚡', key: 'nav_events' },
    { id: 'diplomacy', icon: '🤝', key: 'nav_diplo' },
    { id: 'history', icon: '📖', key: 'nav_history' },
    { id: 'saves', icon: '💾', key: 'nav_saves' },
    { id: 'settings', icon: '⚙️', key: 'nav_settings' },
  ];
  const MOBILE_NAV = ['world', 'court', 'characters', 'history'];

  let currentView = 'world';
  let busy = false;
  let handlers = {}; // 由 game.js 注入 {submitOrder, runCouncil, endTurn}

  /* ============================ 初始化 ============================ */
  function init(h) {
    handlers = h || handlers;
    renderNav();
    renderQuickChips();
    bindComposer();
    bindTopbarButtons();

    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') dismissTopModal();
    });
    window.addEventListener('resize', DS.util.debounce(() => {
      if (DS.Game && DS.Game.state()) renderSituation();
    }, 200));
  }

  /* ============================ 导航 ============================ */
  function renderNav() {
    const t = DS.I18N.t;
    const list = qs('#nav-list');
    list.textContent = '';
    for (const item of NAV_ITEMS) {
      list.append(el('li', {},
        el('button', {
          class: 'nav-item', dataset: { view: item.id },
          onclick: () => showView(item.id),
          'aria-label': t(item.key),
        },
          el('span', { class: 'nav-icon', 'aria-hidden': 'true' }, item.icon),
          el('span', { class: 'nav-text' }, t(item.key)),
        )));
    }
    // 移动端底部导航 + 「更多」抽屉入口
    const mlist = qs('#mobile-nav-list');
    mlist.textContent = '';
    for (const id of MOBILE_NAV) {
      const item = NAV_ITEMS.find((x) => x.id === id);
      mlist.append(el('li', {},
        el('button', { class: 'mnav-item', dataset: { view: id }, onclick: () => showView(id) },
          el('span', { class: 'nav-icon', 'aria-hidden': 'true' }, item.icon),
          el('span', {}, t(item.key)),
        )));
    }
    mlist.append(el('li', {},
      el('button', { class: 'mnav-item', onclick: () => openDrawer() },
        el('span', { class: 'nav-icon', 'aria-hidden': 'true' }, '☰'),
        el('span', {}, '更多'),
      )));
  }

  function setActiveNav(view) {
    currentView = view;
    DS.util.qsa('.nav-item,.mnav-item').forEach((b) => {
      b.classList.toggle('active', b.dataset.view === view);
    });
  }

  function showView(view) {
    if (!DS.Game.state()) return;
    setActiveNav(view);
    closeDrawer();
    const host = qs('#view');
    host.textContent = '';
    const renderer = DS.Views && DS.Views[view];
    if (renderer) renderer.render(host);
    else host.append(el('p', { class: 'muted' }, '（该视图尚未实现）'));
    host.scrollTop = 0;
    try { host.focus({ preventScroll: true }); } catch (_e) { /* 老浏览器 */ }
  }

  function refreshCurrent() { showView(currentView); }

  /* ============================ 顶栏 ============================ */
  function renderTopbar() {
    const state = DS.Game.state();
    if (!state) return;
    qs('#hud-dynasty').textContent = `${state.dynasty.name}·${state.ruler.eraName}`;
    qs('#hud-date').textContent = DS.util.dateLabel(state.date);
    qs('#hud-turn').textContent = `第 ${state.turn} 回合`;
    qs('#hud-seed').textContent = String(state.seed);

    const strip = qs('#metric-strip');
    strip.textContent = '';
    for (const def of DS.State.METRIC_DEFS) {
      strip.append(metricChip(def, state));
    }
    renderSituation();
    // Demo 模式横幅
    const isMock = DS.aiService.isActiveMock('simulation');
    qs('#mock-banner').hidden = !isMock;
    qs('#btn-debug-top').hidden = !DS.Storage.loadSettings().debugMode;
  }

  function metricChip(def, state) {
    const raw = def.key === 'treasury' || def.kind === 'pop'
      ? state.country[def.key]
      : Math.round(state.country[def.key] ?? state.ruler[def.key] ?? 0);
    const valueText = def.kind === 'money' ? DS.util.fmtMoney(raw)
      : def.kind === 'grain' ? DS.util.fmtRes(raw, '石')
      : def.kind === 'pop' ? DS.util.fmtRes(raw, '口')
      : String(raw);

    const trends = (state.trends[def.key] || []);
    const last = trends[0];
    const arrow = !last ? '' : last.delta > 0 ? '↑' : last.delta < 0 ? '↓' : '—';
    const deltaCls = !last ? '' : last.delta > 0 ? 'up' : last.delta < 0 ? 'down' : '';

    const chip = el('div', {
      class: 'metric-chip' + (def.inverted ? ' inverted' : ''),
      role: 'listitem', tabindex: '0',
      'aria-label': `${def.label} ${valueText}`,
    },
      el('span', { class: 'metric-name' }, def.label),
      el('span', { class: 'metric-value' }, valueText),
      el('span', { class: `metric-delta ${deltaCls}`, 'aria-hidden': 'true' }, arrow + (last ? DS.util.fmtSigned(last.delta) : '')),
    );

    const showTip = () => showTooltip(chip, buildMetricTooltip(def, trends));
    chip.addEventListener('mouseenter', showTip);
    chip.addEventListener('focus', showTip);
    chip.addEventListener('mouseleave', hideTooltip);
    chip.addEventListener('blur', hideTooltip);
    return chip;
  }

  function buildMetricTooltip(def, trends) {
    const box = el('div', { class: 'tip-body' },
      el('strong', {}, `${def.label}（${trendRange(trends)}）`),
      el('p', { class: 'muted' }, def.hint || ''));
    const recent = trends.slice(0, 3);
    if (recent.length) {
      box.append(el('div', { class: 'tip-title' }, '最近变化'));
      for (const tr of recent) {
        box.append(el('div', { class: 'tip-line' },
          el('span', { class: tr.delta > 0 ? 'good' : tr.delta < 0 ? 'bad' : '' },
            `${tr.date} ${DS.util.fmtSigned(tr.delta)}`),
          el('span', { class: 'muted' }, tr.reason || '')));
      }
    } else box.append(el('p', { class: 'muted' }, '暂无变化记录'));
    return box;
  }
  function trendRange(trends) {
    if (!trends.length) return '无记录';
    const sum = trends.slice(0, 5).reduce((a, t2) => a + t2.delta, 0);
    return `近5次合计 ${DS.util.fmtSigned(sum)}`;
  }

  /* 共享 tooltip 单例 */
  let tipEl = null;
  function showTooltip(anchor, contentNode) {
    hideTooltip();
    tipEl = el('div', { class: 'tooltip', role: 'tooltip' }, contentNode);
    document.body.append(tipEl);
    const rect = anchor.getBoundingClientRect();
    const tw = Math.min(320, window.innerWidth - 16);
    let left = DS.util.clamp(rect.left + rect.width / 2 - tw / 2, 8, window.innerWidth - tw - 8);
    let top = rect.bottom + 6;
    tipEl.style.width = tw + 'px';
    tipEl.style.left = left + 'px';
    if (top + tipEl.offsetHeight > window.innerHeight - 8) top = rect.top - tipEl.offsetHeight - 6;
    tipEl.style.top = top + 'px';
  }
  function hideTooltip() { if (tipEl) { tipEl.remove(); tipEl = null; } }

  /** 底部一句话局势 */
  function renderSituation() {
    const state = DS.Game.state();
    if (!state) return;
    const line = qs('#situation-line');
    line.textContent = '';
    line.append(el('span', { class: 'sit-tag' }, '当前局势'),
      el('span', {}, DS.State.situationLine(state)));
  }

  /* ============================ 圣旨输入区 ============================ */
  function bindComposer() {
    const input = qs('#order-input');
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', (ev) => {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
        ev.preventDefault();
        handlers.submitOrder && handlers.submitOrder(input.value);
      }
    });
    qs('#btn-issue').addEventListener('click', () => handlers.submitOrder && handlers.submitOrder(input.value));
    qs('#btn-council').addEventListener('click', () => showView('court'));
    qs('#btn-endturn').addEventListener('click', () => handlers.endTurn && handlers.endTurn());
  }

  function autoGrow(ev) {
    const ta = ev.target;
    ta.style.height = 'auto';
    ta.style.height = Math.min(160, ta.scrollHeight) + 'px';
  }

  function clearOrderInput() {
    const input = qs('#order-input');
    input.value = '';
    input.style.height = '';
  }

  function setBusy(b) {
    busy = b;
    for (const id of ['#btn-issue', '#btn-endturn', '#btn-council']) {
      const btn = qs(id);
      if (btn) btn.disabled = b;
    }
    const input = qs('#order-input');
    if (input) input.readOnly = b;
  }
  function isBusy() { return busy; }

  function bindTopbarButtons() {
    qs('#btn-menu-more').addEventListener('click', openSystemMenu);
    qs('#btn-menu').addEventListener('click', openDrawer);
    qs('#drawer-mask').addEventListener('click', closeDrawer);
    qs('#btn-debug-top').addEventListener('click', () => showView('settings'));
  }

  function openSystemMenu() {
    const st = DS.Game.state();
    modal({
      title: '系统',
      build(body) {
        body.append(
          menuBtn('💾 保存游戏（写入下一空槽）', () => { DS.Game.quickSave(); }),
          menuBtn('📖 游戏说明', () => DS.UI.helpDialog()),
          menuBtn('👑 退位并生成《帝王生涯评价》', () => { DS.Game.abdicate(); }),
          st ? menuBtn(`🎲 随机种子：${st.seed}`, null) : null,
          menuBtn('ℹ️ 关于本作', () => aboutDialog()),
        );
      },
    });
  }
  function menuBtn(label, fn) {
    return el('button', { class: 'menu-btn', onclick: fn ? () => { dismissTopModal(); fn(); } : null }, label);
  }

  /* ============================ 快捷命令 chips ============================ */
  function renderQuickChips() {
    const wrap = qs('#quick-chips');
    wrap.textContent = '';
    DS.DATA.QUICK_COMMANDS.forEach((qc, i) => {
      wrap.append(el('button', {
        class: 'chip',
        onclick: () => execQuick(qc.act),
        oncontextmenu: (ev) => { ev.preventDefault(); insertSample(i); },
      }, qc.label));
    });
    // 彩蛋：右键任意 chip 循环填入示例政令
    function insertSample() {
      const samples = DS.DATA.SAMPLE_ORDERS;
      const input = qs('#order-input');
      const next = samples[(sampleIdx++) % samples.length];
      input.value = next;
      input.dispatchEvent(new Event('input'));
    }
  }
  let sampleIdx = 0;

  function execQuick(act) {
    if (act.type === 'view') showView(act.view);
    else if (act.type === 'insert') {
      const input = qs('#order-input');
      input.value = act.text;
      input.dispatchEvent(new Event('input'));
      input.focus();
    } else if (act.type === 'worldLayer') {
      showView('world');
      if (DS.Views.world.setLayer) DS.Views.world.setLayer(act.layer);
    }
  }

  /* ============================ Drawer ============================ */
  let drawerEl = null;
  function openDrawer() {
    closeDrawer();
    const t = DS.I18N.t;
    drawerEl = el('aside', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': '菜单' },
      el('h3', {}, '导航'),
      ...NAV_ITEMS.map((item) => el('button', {
        class: 'drawer-item', onclick: () => { closeDrawer(); showView(item.id); },
      }, el('span', { 'aria-hidden': 'true' }, item.icon), t(item.key))),
      el('hr'),
      el('button', { class: 'drawer-item', onclick: () => { closeDrawer(); DS.UI.helpDialog(); } }, '📖 游戏说明'),
      el('button', { class: 'drawer-item', onclick: () => { closeDrawer(); DS.Game.backToWelcome(); } }, '🏠 返回主菜单'),
    );
    document.body.append(drawerEl);
    qs('#drawer-mask').hidden = false;
  }
  function closeDrawer() {
    if (drawerEl) { drawerEl.remove(); drawerEl = null; }
    const mask = qs('#drawer-mask');
    if (mask) mask.hidden = true;
  }

  /* ============================ Modal ============================ */
  const modalStack = [];
  /**
   * modal({title, wide, build(bodyEl, ctx), actions:[{label,primary,onClick(close)}]})
   */
  function modal(opts) {
    const root = qs('#modal-root');
    const maskDiv = el('div', {
      class: 'modal-mask',
      onclick: (ev) => { if (ev.target === maskDiv && opts.dismissable !== false) close(); },
    });
    const dialog = el('div', {
      class: 'modal' + (opts.wide ? ' modal-wide' : ''),
      role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '对话框',
    });
    dialog.append(el('header', { class: 'modal-head' },
      el('h3', {}, opts.title || ''),
      el('button', { class: 'icon-btn', 'aria-label': '关闭', onclick: () => close() }, '✕')));
    const bodyEl = el('div', { class: 'modal-body' });
    dialog.append(bodyEl);
    if (opts.actions && opts.actions.length) {
      const foot = el('footer', { class: 'modal-foot' });
      for (const act of opts.actions) {
        foot.append(el('button', {
          class: 'btn' + (act.primary ? ' btn-primary' : ''),
          disabled: !!act.disabled,
          onclick: () => act.onClick ? act.onClick(close, act) : close(),
        }, act.label));
      }
      dialog.append(foot);
    }
    maskDiv.append(dialog);
    root.append(maskDiv);
    modalStack.push(close);
    if (opts.build) opts.build(bodyEl, { close });
    // 焦点管理
    const focusable = dialog.querySelector('button,[tabindex]');
    if (focusable) focusable.focus();
    function close() {
      const i = modalStack.indexOf(close);
      if (i >= 0) modalStack.splice(i, 1);
      maskDiv.remove();
    }
    return { close };
  }
  function dismissTopModal() {
    if (modalStack.length) modalStack[modalStack.length - 1]();
  }

  function confirmDialog(message, onYes, danger) {
    modal({
      title: '请确认',
      build(body) { body.append(el('p', { style: 'margin:.4rem 0 .9rem' }, message)); },
      actions: [
        { label: DS.I18N.t('btn_cancel') },
        { label: DS.I18N.t('btn_confirm'), primary: !danger, onClick: (close) => { close(); onYes && onYes(); } },
      ],
    });
  }

  /* ============================ Toast ============================ */
  function toast(msg, type = 'info', ms = 3600) {
    const root = qs('#toast-root');
    const item = el('div', { class: `toast toast-${type}`, role: 'status' }, msg);
    root.append(item);
    requestAnimationFrame(() => item.classList.add('show'));
    setTimeout(() => {
      item.classList.remove('show');
      setTimeout(() => item.remove(), 350);
    }, ms);
  }

  /* ============================ Loading ============================ */
  let loadingEl = null, hintTimer = null, loadingAbort = null;
  /**
   * @param {boolean} show
   * @param {{cancellable?:boolean,onCancel?:Function}} opts
   */
  function loading(show, opts = {}) {
    const root = qs('#loading-root');
    if (!show) {
      if (loadingEl) { loadingEl.remove(); loadingEl = null; }
      clearInterval(hintTimer); hintTimer = null; loadingAbort = null;
      return;
    }
    if (loadingEl) return;
    const t = DS.I18N.t;
    const hintSpan = el('span', { class: 'loading-hint' }, DS.DATA.LOADING_HINTS[0]);
    loadingAbort = opts.onCancel || null;
    loadingEl = el('div', { class: 'loading-mask', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': '加载中' },
      el('div', { class: 'loading-card' },
        el('div', { class: 'loading-brush', 'aria-hidden': 'true' }),
        el('p', { class: 'loading-caption' }, t('loading_caption')),
        el('p', { class: 'loading-steps' }, hintSpan, ' …',
          el('span', { class: 'muted loading-note' }, t('loading_note'))),
        opts.cancellable ? el('button', {
          class: 'btn btn-ghost', onclick: () => { if (loadingAbort) loadingAbort(); loading(false); },
        }, '取消推演') : null,
      ));
    root.append(loadingEl);
    let hi = 0;
    hintTimer = setInterval(() => {
      hi = (hi + 1) % DS.DATA.LOADING_HINTS.length;
      hintSpan.textContent = DS.DATA.LOADING_HINTS[hi];
    }, 900);
  }

  /* ============================ 帮助 / 关于 ============================ */
  function helpDialog() {
    modal({
      title: '游戏说明', wide: true,
      build(body) {
        body.append(el('div', { class: 'help-doc' },
          el('h4', {}, '玩法核心'),
          el('ol', {},
            el('li', {}, '观察天下：地图与顶部指标了解国势；点击地区看详情。'),
            el('li', {}, '廷议：在「朝堂」选择 1～3 位大臣听其意见（不同大臣立场不同）。'),
            el('li', {}, '下诏：在底部圣旨框用自然语言写政令，AI 推演因果后果。'),
            el('li', {}, '推进时间：「结束回合」推进一个月，触发经济结算、事件队列与随机事件。'),
            el('li', {}, '历史书写：一切大事记入《国史实录》，可搜索筛选。')),
          el('h4', {}, '示例政令'),
          ...DS.DATA.SAMPLE_ORDERS.map((s) => el('li', { class: 'help-sample' }, s)),
          el('h4', {}, '提示'),
          el('ul', {},
            el('li', {}, '世界有历史惯性：腐败不会一夜清零，改革有阻力和反噬。'),
            el('li', {}, '数值有上下限与单回合幅度钳制，防止崩坏。'),
            el('li', {}, '没有 API 时可玩本地 Demo 推演模式（界面会标注）。'),
            el('li', {}, '浏览器直连 API 会暴露 Key，敏感场景请使用代理模式。'))));
      },
      actions: [{ label: DS.I18N.t('btn_close'), primary: true }],
    });
  }

  function aboutDialog() {
    modal({
      title: '关于',
      build(body) {
        body.append(el('div', {},
          el('p', {}, '《王朝模拟器：天命》 — AI 原生历史王朝模拟器。'),
          el('p', { class: 'muted' }, '纯前端实现：原生 HTML/CSS/JS，无第三方依赖，数据仅保存在本机浏览器。'),
          el('p', { class: 'muted' }, '本作世界观为原创架空王朝「大晟」，不取材于任何现有商业游戏。')));
      },
      actions: [{ label: DS.I18N.t('btn_close'), primary: true }],
    });
  }

  DS.UI = {
    init, showView, refreshCurrent, renderTopbar, renderSituation,
    setBusy, isBusy, clearOrderInput,
    toast, modal, confirmDialog, loading,
    helpDialog,
    get currentView() { return currentView; },
  };
})(window.DynastySim = window.DynastySim || {});

</script>
<script>
/* ============================================================================
 * views.js — 功能视图集
 * ----------------------------------------------------------------------------
 * world 天下(地图+图层+地区详情+事件队列) / court 朝堂廷议 / characters 人物与召见
 * policies 国策树 / events 事件录 / diplomacy 外交 / history 国史实录
 * saves 存档管理 / settings 设置(AI·推演·游戏·Prompt·数据·调试Inspector)
 * 所有动态文本经 el() 文本节点渲染（XSS 安全）。
 * ==========================================================================*/
(function (DS) {
  'use strict';
  const { el, qs } = DS.util;
  const t = () => DS.I18N.t(); // 返回当前语言词条表；用法 t().key

  /* ============================ 小组件 ============================ */
  function sectionTitle(txt, extra) {
    return el('div', { class: 'sec-title' }, el('h3', {}, txt), extra || null);
  }
  function bar(v, cls, label) {
    const pct = DS.util.clamp(Math.round(v), 0, 100);
    return el('div', { class: 'bar-wrap', role: 'img', 'aria-label': `${label || ''} ${pct}%` },
      el('div', { class: `bar ${cls || ''}` , style: `width:${pct}%` }),
      el('span', { class: 'bar-num' }, String(pct)));
  }
  function severityTag(sev) {
    const map = { low: ['低', 'sev-low'], medium: ['中', 'sev-medium'], high: ['高', 'sev-high'], critical: ['危', 'sev-critical'] };
    const [txt, cls] = map[sev] || map.medium;
    return el('span', { class: `tag ${cls}` }, txt);
  }
  function kv(label, valueNode) {
    return el('div', { class: 'kv' }, el('span', { class: 'kv-k' }, label), el('span', { class: 'kv-v' }, valueNode));
  }
  function portrait(c, size) {
    return el('div', {
      class: 'portrait',
      style: `--h:${c.hue || 200};width:${size || 52}px;height:${size || 52}px;font-size:${(size || 52) * 0.42}px`,
      'aria-hidden': 'true',
    }, c.name[0]);
  }
  function emptyHint(txt) { return el('p', { class: 'muted center' }, txt); }

  /* ============================================================
   * 天下视图
   * ============================================================ */
  let worldLayer = 'standard';
  let selectedRegion = null;

  const worldView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      selectedRegion = selectedRegion && DS.State.getRegion(state, selectedRegion) ? selectedRegion : null;

      // 图层切换条
      const layerBar = el('div', { class: 'layer-bar', role: 'toolbar', 'aria-label': '地图图层' },
        ...DS.MapView.LAYERS.map((l) => el('button', {
          class: 'chip layer-chip' + (l.id === worldLayer ? ' active' : ''),
          onclick: () => { worldLayer = l.id; worldView.render(host); },
        }, l.label)));

      const mapBox = el('div', { class: 'map-box' });
      DS.MapView.render(mapBox, state, worldLayer, (rid) => {
        selectedRegion = rid;
        worldView.render(host);
        renderRegionDetail(detailBox, rid);
      });

      host.append(
        sectionTitle(t().view_world),
        el('div', { class: 'world-grid' },
          el('div', { class: 'map-panel panel' }, layerBar, mapBox,
            el('p', { class: 'muted map-hint' }, '点击地区查看详情 · 图层切换显示不同维度')),
          el('div', { class: 'side-col' },
            (detailBox = el('div', { class: 'panel region-detail' })),
            pendingQueuePanel(state)),
        ),
      );
      if (selectedRegion) renderRegionDetail(detailBox, selectedRegion);
      else detailBox.append(emptyHint('点击左侧地图任意地区，查看当地民情、财政与灾害。'));
    },
    setLayer(l) { worldLayer = l; DS.UI.refreshCurrent(); },
  };
  let detailBox = null;

  function pendingQueuePanel(state) {
    const pe = state.pendingEvents || [];
    return el('div', { class: 'panel' },
      el('h4', {}, `事件队列（${pe.length}）`),
      pe.length === 0
        ? emptyHint('暂无待触发隐患。')
        : el('ul', { class: 'queue-list' },
          ...pe.slice(0, 6).map((p) => el('li', {},
            el('div', {}, severityTag(p.severity), ` 第 ${p.dueTurn} 回合：${p.title}`),
            el('div', { class: 'muted small' }, p.description)))),
    );
  }

  function renderRegionDetail(box, rid) {
    box.textContent = '';
    const state = DS.Game.state();
    const r = DS.State.getRegion(state, rid);
    if (!r) return;
    box.textContent = '';
    const gov = r.governor ? DS.State.getCharacter(state, r.governor) : null;
    box.append(
      el('h4', {}, `${r.name}`, gov ? el('span', { class: 'muted small' }, `　巡抚/镇守：${gov.name}`) : null),
      el('p', { class: 'muted' }, r.desc),
      r.disaster ? el('p', { class: 'disaster-line' }, `⚠ 当前灾情：${r.disaster.type}（强度 ${r.disaster.severity}/5，${DS.DATA.SEVERITY_LABELS[r.disaster.severity]}）`) : null,
      kv('人口', DS.util.fmtRes(r.population, '口')),
      kv('存粮', DS.util.fmtRes(r.grain, '石')),
      kv('月入税基', DS.util.fmtMoney(r.income)),
      kv('税率', `${r.taxRate}%`),
      kv('民心', bar(r.loyalty, 'good', '民心')),
      kv('治安', bar(r.security, '', '治安')),
      kv('腐败', bar(r.corruption, 'bad', '腐败')),
      kv('叛乱风险', bar(r.unrest, r.unrest >= 70 ? 'bad' : r.unrest >= 45 ? 'warn' : '', '叛乱风险')),
      el('div', { class: 'row-gap' },
        gov ? el('button', {
          class: 'btn btn-sm',
          onclick: () => DS.UI.showView('characters'),
        }, '查看此地官员') : null),
    );
  }

  /* ============================================================
   * 朝堂视图（廷议）
   * ============================================================ */
  const courtSel = new Set();
  const courtView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      [...courtSel].forEach((id) => { if (!DS.State.getCharacter(state, id)) courtSel.delete(id); });
      while (courtSel.size > 3) courtSel.delete([...courtSel][0]);

      const grid = el('div', { class: 'court-grid' },
        ...state.characters.map((c) => {
          const picked = courtSel.has(c.id);
          return el('button', {
            class: 'court-card' + (picked ? ' picked' : ''),
            'aria-pressed': picked,
            onclick: () => {
              if (courtSel.has(c.id)) courtSel.delete(c.id);
              else { if (courtSel.size >= 3) { DS.UI.toast('一次至多召对三位大臣。', 'warn'); return; } courtSel.add(c.id); }
              courtView.render(host);
            },
          },
            portrait(c, 40),
            el('div', { class: 'court-card-info' },
              el('strong', {}, c.name),
              el('div', { class: 'muted small' }, `${c.role} · ${c.faction}`),
              el('div', { class: 'small' }, `忠${Math.round(c.loyalty)} 能${c.ability} 信${Math.round(c.trust)}`)),
          );
        }));

      host.append(
        sectionTitle(t().view_court, el('span', { class: 'muted small' }, '选择 1～3 位大臣听其意见；不同大臣立场不同。')),
        grid,
        el('div', { class: 'row-gap' },
          el('button', {
            class: 'btn btn-primary',
            disabled: courtSel.size === 0 || DS.UI.isBusy(),
            onclick: () => DS.Game.runCouncil([...courtSel]),
          }, `召集廷议（已选 ${courtSel.size}/3）`),
          el('button', { class: 'btn', onclick: () => { courtSel.clear(); courtView.render(host); } }, '清空选择')),

        transcriptPanel(state),
      );
    },
  };

  function transcriptPanel(state) {
    const logs = (state.councilLog || []).slice(0, 5); // 最近五次廷议
    if (!logs.length) return emptyHint('尚未举行廷议。选择大臣后点「召集廷议」。');
    return el('div', { class: 'panel' },
      ...logs.map((log) => el('div', { class: 'council-session' },
        el('h4', {}, `${log.date} 廷议　`,
          el('span', { class: 'muted small' }, log.consensus)),
        ...log.speeches.map((sp) => el('blockquote', { class: 'speech' },
          el('footer', { class: 'speech-head' },
            el('strong', {}, sp.name),
            el('span', { class: 'muted small' }, `${sp.role} · 立场：${sp.stance} · ${supportLabel(sp.support)}`)),
          el('p', {}, sp.content),
          el('button', {
            class: 'btn btn-sm',
            title: '把该建议写入圣旨输入框，并记录君臣信任变化',
            onclick: () => DS.Game.adoptAdvice(sp.characterId, sp.content),
          }, '采纳此议 ▸'))))));
  }
  function supportLabel(s) { return s === 'support' ? '赞同' : s === 'oppose' ? '反对' : '保留'; }

  /* ============================================================
   * 人物视图
   * ============================================================ */
  const charsView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      host.append(sectionTitle(t().view_chars, el('span', { class: 'muted small' }, '点击人物查看详情并可「召见」问对。')));
      const grid = el('div', { class: 'char-grid' });
      for (const c of state.characters) {
        grid.append(el('button', {
          class: 'char-card',
          onclick: () => characterModal(c.id),
          'aria-label': `${c.name}，${c.role}`,
        },
          portrait(c),
          el('div', { class: 'char-info' },
            el('strong', {}, c.name),
            el('div', { class: 'muted small' }, `${c.role} · ${c.faction}`),
            el('div', { class: 'small' }, `忠诚 ${Math.round(c.loyalty)}｜信任 ${Math.round(c.trust)}｜能力 ${c.ability}`)),
        ));
      }
      host.append(grid);
    },
  };

  function characterModal(id) {
    const state = DS.Game.state();
    const c = DS.State.getCharacter(state, id);
    if (!c) return;
    const secretRevealed = (state.flags.revealedSecrets || []).includes(c.id);

    DS.UI.modal({
      title: `${c.name} · ${c.role}`, wide: true,
      build(body, ctx) {
        const rels = Object.entries(c.relationships || {}).map(([oid, r]) => {
          const o = DS.State.getCharacter(state, oid);
          return o ? `${o.name}（${r.type}）` : null;
        }).filter(Boolean);

        body.append(el('div', { class: 'char-detail' },
          el('div', { class: 'char-head' },
            portrait(c, 72),
            el('div', {},
              el('p', {}, c.desc),
              el('p', { class: 'small muted' }, `性格：${c.personality.join(' · ')}`))),
          el('div', { class: 'kv-grid' },
            kv('派系', c.faction), kv('年龄', `${c.age}`),
            kv('忠诚', bar(c.loyalty, c.loyalty < 40 ? 'bad' : '')),
            kv('对陛下的信任', bar(c.trust, '')),
            kv('能力', bar(c.ability, '')), kv('野心', bar(c.ambition, 'warn')),
            kv('贪腐倾向', bar(c.corruption, 'bad')),
            kv('当前事务', c.task)),
          rels.length ? kv('人物关系', rels.join('、')) : null,
          kv('近期言行', c.dialogueMemory.length
            ? el('ul', { class: 'mini-list' }, ...c.dialogueMemory.slice(-3).reverse().map((m) => el('li', { class: 'small' }, m)))
            : '（尚无）'),
          el('div', { class: 'secret-line' },
            el('strong', {}, '秘密情报：'),
            c.secrets.length
              ? (secretRevealed
                ? el('span', { class: 'secret-open' }, c.secrets.join('；'))
                : el('span', { class: 'muted' }, `已探明 ${c.secrets.length} 条（未揭示）`))
              : el('span', { class: 'muted' }, '未发现'),
            (!secretRevealed && c.secrets.length) ? el('button', {
              class: 'btn btn-sm', style: 'margin-left:.6rem',
              onclick: () => { ctx.close(); DS.Game.investigateSecret(c.id); },
            }, '命缇骑密查') : null),
        ));

        // 对话记录容器
        const chatBox = el('div', { class: 'chat-box', 'aria-live': 'polite' });
        renderChatHistory(chatBox, c);
        const ta = el('textarea', { class: 'chat-input', rows: '2', placeholder: `向 ${c.name} 问话……（例如：你怎么看现在的财政危机？）`, 'aria-label': '对话输入' });
        const sendBtn = el('button', { class: 'btn btn-primary', onclick: doSend }, '召见问对');
        function doSend() {
          const msg = ta.value.trim();
          if (!msg || sendBtn.disabled) return;
          sendBtn.disabled = true;
          ta.value = '';
          DS.Game.talkTo(c.id, msg).finally(() => {
            sendBtn.disabled = false;
            renderChatHistory(chatBox, c);
            chatBox.scrollTop = chatBox.scrollHeight;
          }).catch(() => {});
        }
        ta.addEventListener('keydown', (ev) => {
          if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') doSend();
        });
        body.append(el('hr'), el('h4', {}, '召见问对'), chatBox,
          el('div', { class: 'chat-compose' }, ta, sendBtn));
      },
      actions: [{ label: t().btn_close }],
    });
  }

  function renderChatHistory(box, c) {
    box.textContent = '';
    box.textContent = '';
    if (!c.dialogueMemory.length) {
      box.append(emptyHint('君臣尚未交谈。'));
      return;
    }
    for (const m of c.dialogueMemory.slice(-8)) {
      const mine = m.startsWith('【陛下】');
      box.append(el('div', { class: `chat-msg ${mine ? 'mine' : 'theirs'}` }, m.replace(/^【[^】]+】/, '')));
    }
  }

  /* ============================================================
   * 国策视图
   * ============================================================ */
  const CATS = ['政治', '财政', '农业', '军事', '教育', '科技', '外交', '民生', '行政'];
  const policiesView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      host.append(sectionTitle(t().view_policy, el('span', { class: 'muted small' }, '国策只改变世界规则参数；事件仍由世界状态与推演产生。')));
      for (const cat of CATS) {
        const items = state.policiesKnown.filter((p) => p.cat === cat);
        if (!items.length) continue;
        host.append(el('details', { class: 'policy-cat', open: 'true' },
          el('summary', {}, `${cat}（${items.filter((p) => state.activePolicies.includes(p.id)).length}/${items.length}）`),
          el('div', { class: 'policy-list' },
            ...items.map((p) => policyCard(state, p)))));
      }
    },
  };

  function policyCard(state, p) {
    const adopted = state.activePolicies.includes(p.id);
    const missingPrereq = (p.prereq || []).filter((pid) => !state.activePolicies.includes(pid));
    const canAfford = state.country.treasury >= p.cost;
    const namesOf = (ids) => ids.map((pid) => (state.policiesKnown.find((x) => x.id === pid) || {}).name).filter(Boolean).join('、');
    return el('div', { class: 'policy-card' + (adopted ? ' adopted' : '') },
      el('header', {}, el('strong', {}, p.name),
        adopted ? el('span', { class: 'tag tag-ok' }, '已推行') : null),
      el('p', { class: 'small muted' }, p.side),
      kv('成本', DS.util.fmtMoney(p.cost)),
      (p.prereq && p.prereq.length) ? kv('前置', namesOf(p.prereq) + (missingPrereq.length ? '（未满足）' : '')) : null,
      kv('即时效果', describeChanges(p.instant)),
      Object.keys(p.ongoing || {}).length ? kv('持续效果', describeOngoing(p.ongoing)) : null,
      !adopted ? el('button', {
        class: 'btn btn-sm btn-primary',
        disabled: missingPrereq.length > 0 || !canAfford,
        title: !canAfford ? '国库不足' : '',
        onclick: () => DS.Game.adoptPolicy(p.id),
      }, canAfford ? '推行此策' : '国库不足') : null);
  }
  function describeChanges(ch) {
    if (!ch) return '—';
    const names = { treasury: '国库', food: '粮食', publicSupport: '民心', stability: '稳定', corruption: '腐败', bureaucracy: '官僚效率', militaryPower: '军力', authority: '皇权', morale: '士气' };
    return Object.entries(ch).map(([k, v]) => `${names[k] || k} ${v > 0 ? '+' : ''}${v}`).join('，') || '—';
  }
  function describeOngoing(o) {
    const names = { incomeMult: '岁入', grainMult: '粮产', tradeMult: '贸易', armyPayMult: '军费', reliefEffMult: '赈济' };
    return Object.entries(o).map(([k, v]) => k.endsWith('Mult')
      ? `${names[k] || k} ${(v > 0 ? '+' : '') + Math.round(v * 100)}%`
      : ({ corruptionDrift: '腐败漂移', loyaltyDrift: '民心漂移', securityBonus: '治安', borderDefenseBonus: '边防', adminBonus: '行政效率' }[k] || k) + ' ' + (v > 0 ? '+' : '') + v
    ).join('，');
  }

  /* ============================================================
   * 事件视图
   * ============================================================ */
  const evtFilter = { sev: 'all', cat: 'all' };
  const eventsView = {
    render(host) {
      host.textContent = ''; // 幂等：内部重渲染时先清空，避免新旧 DOM 并存
      const state = DS.Game.state();
      const sevSel = el('select', { 'aria-label': '按严重程度筛选' },
        el('option', { value: 'all' }, '全部程度'),
        ...['critical', 'high', 'medium', 'low'].map((s) => el('option', { value: s, selected: evtFilter.sev === s ? '' : null },
          { critical: '危机', high: '严重', medium: '一般', low: '轻微' }[s])));
      const cats = [...new Set(state.events.map((e) => e.category))];
      const catSel = el('select', { 'aria-label': '按类别筛选' },
        el('option', { value: 'all' }, '全部类别'),
        ...cats.map((ct) => el('option', { value: ct, selected: evtFilter.cat === ct ? '' : null }, ct)));
      sevSel.addEventListener('change', () => { evtFilter.sev = sevSel.value; eventsView.render(host); });
      catSel.addEventListener('change', () => { evtFilter.cat = catSel.value; eventsView.render(host); });

      let list = state.events;
      if (evtFilter.sev !== 'all') list = list.filter((e) => e.severity === evtFilter.sev);
      if (evtFilter.cat !== 'all') list = list.filter((e) => e.category === evtFilter.cat);
      list = list.slice(0, 80);

      host.append(sectionTitle(t().view_events, el('span', { class: 'filters' }, sevSel, catSel)));
      if (!list.length) host.append(emptyHint('暂无符合条件的事件。'));
      for (const e of list) {
        const region = e.regionId ? DS.State.getRegion(state, e.regionId) : null;
        const person = e.characterId ? DS.State.getCharacter(state, e.characterId) : null;
        host.append(el('article', { class: `event-card sev-${e.severity}` },
